<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ตึกแดง Back Office Preview</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --sidebar: #181818;
      --card: #1e1e1e;
      --card-2: #242424;
      --border: #2f2f2f;
      --accent: #dc2626;
      --text: #f5f5f5;
      --muted: #9ca3af;
      --dim: #666;
      --green: #22c55e;
      --amber: #f59e0b;
      --blue: #3b82f6;
      --red-soft: #450a0a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: 224px 1fr;
      height: 100vh;
      height: 100dvh;
      min-width: 0;
    }

    .sidebar {
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .brand {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--border);
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.1;
      color: var(--accent);
      font-weight: 800;
    }

    .brand span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 5px;
    }

    nav {
      padding: 8px 0;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--muted);
      text-align: left;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      cursor: pointer;
      border-left: 3px solid transparent;
    }

    .nav-btn.active {
      color: #fff;
      background: #2a0a0a;
      border-left-color: var(--accent);
      font-weight: 650;
    }

    .nav-icon {
      width: 19px;
      text-align: center;
      color: inherit;
      font-size: 14px;
    }

    .admin {
      border-top: 1px solid var(--border);
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
    }

    .admin strong {
      display: block;
      font-size: 12px;
    }

    .admin small {
      color: var(--muted);
      font-size: 10px;
    }

    main {
      overflow: auto;
      padding: 24px 28px 36px;
      min-width: 0;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      min-width: 0;
    }

    h2 {
      margin: 0;
      font-size: 21px;
      line-height: 1.2;
    }

    .sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      gap: 14px;
      min-width: 0;
    }

    .metrics {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 18px;
    }

    .two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-bottom: 16px;
    }

    .three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      min-width: 0;
    }

    .card.pad { padding: 16px; }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 23px;
      font-weight: 760;
    }

    .metric-change {
      margin-top: 5px;
      font-size: 12px;
      color: var(--green);
    }

    .metric-change.down { color: #f87171; }

    .section-title {
      margin: 0 0 14px;
      font-size: 14px;
      font-weight: 700;
    }

    .bar-row {
      margin-bottom: 12px;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .bar-label span:last-child { color: var(--muted); }

    .bar {
      height: 5px;
      background: #333;
      border-radius: 99px;
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
    }

    .activity {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }

    .activity:last-child { border-bottom: 0; }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .activity-text {
      flex: 1;
      min-width: 0;
    }

    .activity-text strong {
      display: block;
      font-size: 13px;
      font-weight: 520;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .activity-text small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }

    .time {
      color: var(--dim);
      font-size: 11px;
      flex: 0 0 auto;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      padding: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    input, select, textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 11px;
      font-size: 13px;
      outline: none;
    }

    input { min-width: 240px; flex: 1; }

    button.action {
      border: 0;
      border-radius: 6px;
      padding: 8px 13px;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      min-height: 34px;
      white-space: nowrap;
    }

    button.secondary { background: #1e3a5f; color: #60a5fa; }
    button.green { background: #12391f; color: #4ade80; }
    button.gray { background: #2a2a2a; color: #bbb; }
    button.warn { background: #7c2d12; color: #fb923c; }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-size: 13px;
    }

    .table-wrap {
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    .table-hint {
      display: none;
      color: var(--muted);
      font-size: 11px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      background: #171717;
    }

    th, td {
      text-align: left;
      padding: 11px 13px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
    }

    tbody tr:hover { background: #252525; }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 700;
    }

    .b-active, .b-published, .b-sold { background: #14532d; color: #4ade80; }
    .b-sale, .b-banned { background: #450a0a; color: #f87171; }
    .b-suspended, .b-flagged, .b-scheduled { background: #713f12; color: #fbbf24; }
    .b-show, .b-draft, .b-email { background: #1e3a5f; color: #60a5fa; }
    .b-hide, .b-apple, .b-google { background: #2a2a2a; color: #d1d5db; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin: 0 0 5px;
    }

    .field { margin-bottom: 12px; }
    .field input, .field select, .field textarea { width: 100%; min-width: 0; }
    textarea { resize: vertical; min-height: 82px; }

    .empty {
      display: grid;
      place-items: center;
      min-height: 360px;
      color: var(--muted);
      text-align: center;
    }

    .empty strong {
      display: block;
      color: var(--text);
      font-size: 18px;
      margin-bottom: 7px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 50;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(760px, 100%);
      max-height: min(780px, 92vh);
      max-height: min(780px, 92dvh);
      overflow: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    .modal-head {
      padding: 15px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-head h3 {
      margin: 0;
      font-size: 16px;
    }

    .modal-close {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 6px;
    }

    .modal-body { padding: 18px; }

    .modal-foot {
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      background: #12391f;
      color: #86efac;
      border: 1px solid #14532d;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      display: none;
      z-index: 60;
    }

    .toast.show { display: block; }

    @media (max-width: 920px) {
      .app { grid-template-columns: 70px 1fr; }
      .brand h1, .brand span, .nav-label, .admin div:not(.avatar) { display: none; }
      .brand { padding: 16px 0; text-align: center; }
      .nav-btn { justify-content: center; padding: 11px 0; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .two, .three, .form-grid { grid-template-columns: 1fr; }
      main { padding: 18px; }
      .modal { width: min(720px, 96vw); }
    }

    @media (max-width: 640px) {
      body { overflow: hidden; }

      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--border);
        min-height: 0;
        max-height: 132px;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px 8px;
        text-align: left;
      }

      .brand h1 {
        display: block;
        font-size: 16px;
      }

      .brand span {
        display: block;
        font-size: 10px;
        margin-top: 2px;
      }

      nav {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 6px 8px 10px;
        flex: 0 0 auto;
        scrollbar-width: thin;
      }

      .nav-btn {
        width: auto;
        min-width: 76px;
        flex: 0 0 auto;
        flex-direction: column;
        justify-content: center;
        gap: 4px;
        padding: 8px 8px;
        border-left: 0;
        border-bottom: 2px solid transparent;
        border-radius: 6px;
        text-align: center;
        font-size: 11px;
      }

      .nav-btn.active {
        border-left-color: transparent;
        border-bottom-color: var(--accent);
      }

      .nav-label {
        display: block;
        max-width: 70px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .nav-icon {
        width: auto;
        font-size: 14px;
      }

      .admin { display: none; }

      main {
        padding: 14px 12px 22px;
      }

      .header {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        margin-bottom: 14px;
      }

      h2 { font-size: 18px; }
      .sub { font-size: 12px; }

      .header > button,
      .header > .action {
        width: 100%;
      }

      .metrics, .two, .three, .form-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .card.pad { padding: 12px; }

      .metric-value {
        font-size: 20px;
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 10px;
      }

      input, select, textarea {
        width: 100%;
        min-width: 0;
        font-size: 16px;
      }

      button.action {
        width: 100%;
        white-space: normal;
      }

      table {
        min-width: 720px;
        font-size: 12px;
      }

      .table-hint { display: block; }

      th, td {
        padding: 10px;
      }

      td .action,
      td button.action {
        width: auto;
        margin: 2px;
      }

      .modal-backdrop {
        padding: 0;
        align-items: stretch;
      }

      .modal {
        width: 100vw;
        height: 100dvh;
        max-height: 100dvh;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
        display: flex;
        flex-direction: column;
      }

      .modal-head {
        padding: 12px 14px;
        flex: 0 0 auto;
      }

      .modal-body {
        padding: 14px 12px;
        overflow: auto;
        flex: 1;
      }

      .modal-foot {
        padding: 10px 12px;
        display: grid;
        grid-template-columns: 1fr;
        flex: 0 0 auto;
      }

      .toast {
        left: 12px;
        right: 12px;
        bottom: 12px;
        text-align: center;
      }
    }

    @media (max-width: 380px) {
      .nav-btn {
        min-width: 68px;
        font-size: 10px;
      }

      .brand span { display: none; }
      main { padding: 12px 10px 18px; }
      h2 { font-size: 17px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>ตึกแดง</h1>
        <span>ระบบหลังบ้าน v1.2 Preview</span>
      </div>
      <nav id="nav"></nav>
      <div class="admin">
        <div class="avatar">S</div>
        <div>
          <strong>ผู้ดูแลสูงสุด</strong>
          <small>admin@tukdaeng.com</small>
        </div>
      </div>
    </aside>
    <main id="main"></main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h3 id="modalTitle">ดำเนินการ</h3>
        <button class="modal-close" type="button" data-close-modal>&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </section>
  </div>
  <div class="toast" id="toast">บันทึกแล้ว</div>

  <script>
    const nav = [
      ["dashboard", "แดชบอร์ด", "▦"],
      ["users", "ผู้ใช้งาน", "◎"],
      ["assets", "สินทรัพย์", "⌚"],
      ["offers", "ข้อเสนอและแชท", "⇄"],
      ["social", "โซเชียล", "♡"],
      ["articles", "กระดานข่าว", "▤"],
      ["market", "ข้อมูลตลาด", "↗"],
      ["alerts", "แจ้งเตือนนาฬิกา", "🔔"],
      ["directory", "ไดเรกทอรี", "⌂"],
      ["support", "ช่วยเหลือ", "?"],
      ["notifications", "แจ้งเตือน", "✉"],
      ["reports", "รายงาน", "≡"],
      ["audit", "บันทึกระบบ", "⌕"],
      ["settings", "ตั้งค่า", "⚙"]
    ];

    const users = [
      ["U001", "Vintage Vault BKK", "info@vintagevault.com", "Email", "14", "Active", "2h ago"],
      ["U002", "The Collector", "collector@mail.com", "Google", "6", "Active", "5h ago"],
      ["U003", "horology.king", "hking@mail.com", "Email", "22", "Suspended", "3d ago"],
      ["U004", "Marcus V", "marcus@mail.com", "Apple", "0", "Active", "1d ago"],
      ["U005", "Sophie Patek", "sophie@mail.com", "Email", "8", "Active", "30m ago"]
    ];

    const assets = [
      ["A001", "Patek Philippe", "Nautilus 5711/1A", "5711/1A-010", "Vintage Vault BKK", "THB 1,200,000", "Sale", "No"],
      ["A002", "Rolex", "Submariner Date", "116610LN", "horology.king", "THB 350,000", "Sale", "Yes"],
      ["A003", "Audemars Piguet", "Royal Oak Day-Date", "26330OR", "Vintage Vault BKK", "THB 3,080,000", "Collection Show", "No"],
      ["A004", "Omega", "Speedmaster Pro", "310.30.42.50", "Sophie Patek", "THB 145,000", "Collection Hide", "No"],
      ["A005", "IWC", "Pilot's Watch XVI", "IW325501", "The Collector", "THB 120,000", "Sold", "No"]
    ];

    const offers = [
      ["OF001", "A001", "Marcus V", "Vintage Vault BKK", "THB 1,100,000", "Pending", "12m ago"],
      ["OF002", "A002", "The Collector", "horology.king", "THB 320,000", "Accepted", "1h ago"],
      ["OF003", "A005", "Sophie Patek", "The Collector", "THB 112,000", "Declined", "4h ago"],
      ["OF004", "A003", "Marcus V", "Vintage Vault BKK", "THB 2,950,000", "Expired", "1d ago"]
    ];

    const comments = [
      ["CM001", "A002", "watchfan88", "Is box and papers included?", "Visible", "0"],
      ["CM002", "A001", "collector_bkk", "Can inspect in Bangkok?", "Visible", "0"],
      ["CM003", "A004", "newuser", "Suspicious price", "Reported", "2"],
      ["CM004", "A003", "modnote", "Removed spam link", "Hidden", "1"]
    ];

    let boardTab = "articles";

    function badge(value) {
      const key = String(value).toLowerCase().replace(/\s+/g, "-");
      let cls = "b-hide";
      if (["active", "published", "sold", "accepted", "visible", "resolved"].includes(key)) cls = "b-active";
      if (["sale", "banned", "declined", "failed"].includes(key)) cls = "b-sale";
      if (["suspended", "flagged", "scheduled", "pending", "reported", "expired"].includes(key)) cls = "b-suspended";
      if (["collection-show", "draft", "email", "open"].includes(key)) cls = "b-show";
      return `<span class="badge ${cls}">${value}</span>`;
    }

    function header(title, sub, action) {
      return `<div class="header"><div><h2>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ""}</div>${action || ""}</div>`;
    }

    function toolbar(search, filters = []) {
      return `<div class="toolbar"><input placeholder="${search}">${filters.map(f => `<select><option>${f}</option></select>`).join("")}<button class="action green">ส่งออก CSV</button></div>`;
    }

    function table(cols, rows, actions) {
      return `<div class="table-wrap card"><div class="table-hint">เลื่อนซ้าย/ขวาเพื่อดูข้อมูลทั้งหมด</div><table><thead><tr>${cols.map(c => `<th>${c}</th>`).join("")}${actions ? "<th>การทำงาน</th>" : ""}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${["Active","Suspended","Sale","Collection Show","Collection Hide","Sold","Pending","Accepted","Declined","Expired","Visible","Reported","Hidden","Email","Apple","Google","Open","Resolved"].includes(cell) ? badge(cell) : cell}</td>`).join("")}${actions ? `<td>${actions}</td>` : ""}</tr>`).join("")}</tbody></table></div>`;
    }

    function boardTabs() {
      return `<div class="toolbar">
        ${[
          ["articles", "บทความ"],
          ["categories", "หมวดหมู่"],
          ["banners", "แบนเนอร์ Board"],
          ["analytics", "สถิติ Board"]
        ].map(([id, label]) => `<button class="action ${boardTab === id ? "" : "gray"}" data-board-tab="${id}">${label}</button>`).join("")}
      </div>`;
    }

    function subHeader(title, description, actionHtml = "") {
      return `<div class="header" style="margin:0 0 12px">
        <div>
          <h2 style="font-size:16px">${title}</h2>
          <div class="sub">${description}</div>
        </div>
        ${actionHtml}
      </div>`;
    }

    function boardContent() {
      if (boardTab === "categories") {
        return `${subHeader("หมวดหมู่บทความ", "จัดกลุ่มบทความที่แสดงในเมนู Board ของหน้าบ้าน", `<button class="action">+ เพิ่มหมวดหมู่</button>`)}
          ${toolbar("ค้นหาชื่อหมวดหมู่หรือ slug...", ["ทุกสถานะ"])}
          ${table(["รหัส","ชื่อหมวดหมู่","Slug","ลำดับแสดงผล","จำนวนบทความ","สถานะ"], [
            ["CAT001","Watch 101","watch-101","1","14","Active"],
            ["CAT002","Watch Brands","watch-brands","2","18","Active"],
            ["CAT003","Watch Market","watch-market","3","9","Active"],
            ["CAT004","Watch Events","watch-events","4","3","Active"]
          ], `<button class="action secondary">แก้ไข</button> <button class="action warn">ปิดใช้งาน</button>`)}`;
      }

      if (boardTab === "banners") {

      if (btn) render(btn.dataset.page);

      const toast = document.getElementById("toast");
      toast.textContent = message;

      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

      }

      if (label === "Preview FO" || label === "Preview as FO" || label === "พรีวิว FO") {
        openModal("พรีวิวหน้าบ้าน", previewFoArticle(), `<button class="action gray" data-close-modal>ปิด</button>`);
        return true;
      }

      if (label === "Edit" || label === "แก้ไข") {
        if (page === "articles") openModal("แก้ไขบทความ", articleForm("Edit"));
        else if (page === "users") openModal("ดู/แก้ไขผู้ใช้งาน", genericForm("User", [["ชื่อผู้ใช้", "Vintage Vault BKK"], ["อีเมล", "info@vintagevault.com"], ["โทรศัพท์", "081-234-5678"], ["สถานะ", "Active"]]));
        else if (page === "assets") openModal("แก้ไขสินทรัพย์", genericForm("Asset", [["แบรนด์", "Rolex"], ["รุ่น", "Submariner Date"], ["Reference No.", "116610LN"], ["ราคา", "THB 350,000"], ["สถานะ", "Sale"]]));
        else if (page === "market") openModal("แก้ไขข้อมูลตลาด", genericForm("Market", [["แบรนด์", "Rolex"], ["รุ่น", "Submariner Date"], ["Reference", "126610LN"], ["ราคาต่ำสุด", "320000"], ["ราคาสูงสุด", "380000"]]));
        else if (page === "directory") openModal("แก้ไขข้อมูลไดเรกทอรี", genericForm("Directory", [["ชื่อ", "Siam Watch Gallery"], ["หมวดหมู่", "Watch Shops"], ["จังหวัด", "กรุงเทพฯ"], ["โทรศัพท์", "02-123-4567"], ["เว็บไซต์", "https://example.com"]]));
        else openModal("แก้ไขรายการ", genericForm("Record", [["ชื่อ", ""], ["สถานะ", "Active"], ["หมายเหตุ", "", "textarea"]]));
        return true;
      }

      if ((label.includes("Broadcast") || label === "ส่งแจ้งเตือน" || label === "+ สร้าง Broadcast") && page === "notifications") {
        openModal("จัดการแจ้งเตือน", notificationDetail(), `<button class="action gray" data-close-modal>ปิด</button><button class="action secondary" data-save-modal>พรีวิว</button><button class="action" data-save-modal>ส่งแจ้งเตือน</button>`);
        return true;
      }

      if (page === "settings" && (label.includes("เพิ่มบัญชีแอดมิน") || label === "รายละเอียด" || label === "แก้ไข")) {
        openModal("ตั้งค่าบัญชีแอดมินและสิทธิ์", genericForm("Admin Settings", [["ชื่อแอดมิน", "content.admin"], ["อีเมล", "content@tukdaeng.com"], ["Role", "Content Admin"], ["2FA", "Enabled"], ["IP Whitelist", "Production only"], ["หมายเหตุ", "จัดการสิทธิ์ตาม role matrix", "textarea"]]));
        return true;
      }

      if (label.startsWith("+ Add") || label.startsWith("+ Invite") || label.startsWith("+ New") || label.startsWith("+ เพิ่ม") || label === "Assign Ticket" || label === "มอบหมาย Ticket") {
        const title = label.replace("+ ", "");
        openModal(title, genericForm(title, [["ชื่อ / หัวข้อ", ""], ["หมวดหมู่ / ประเภท", ""], ["สถานะ", "Active"], ["รายละเอียด", "", "textarea"]]));
        return true;
      }

      if ((label === "View" || label === "ดู") && page === "assets") {
        openModal("รายละเอียดสินทรัพย์ - A002", assetDetail(), `<button class="action gray" data-close-modal>ปิด</button><button class="action warn" data-save-modal>Flag / Unflag</button><button class="action gray" data-save-modal>บังคับเปลี่ยนสถานะ</button><button class="action" data-save-modal>บันทึกผลตรวจ</button>`);
        return true;
      }

      if ((label === "View" || label === "ดู" || label === "เปิด" || label === "รายละเอียด") && page === "users") {
        openModal("รายละเอียดผู้ใช้งาน - U002", userDetail(), `<button class="action gray" data-close-modal>ปิด</button><button class="action warn" data-save-modal>ระงับบัญชี</button><button class="action" data-save-modal>บันทึกโน้ต</button>`);
        return true;
      }

      if ((label === "View" || label === "ดู" || label === "ตรวจรายการค้าง") && page === "offers") {
        openModal("รายละเอียดข้อเสนอและแชท - OF001", offerDetail(), `<button class="action gray" data-close-modal>ปิด</button><button class="action warn" data-save-modal>หมดอายุทันที</button><button class="action" data-save-modal>บันทึกผลตรวจ</button>`);
        return true;
      }

      if ((label === "View" || label === "ดู" || label === "เฉพาะที่ถูกรายงาน" || label === "ซ่อน") && page === "social") {
        openModal("ตรวจคอมเมนต์ - CM003", commentDetail(), `<button class="action gray" data-close-modal>ปิด</button><button class="action warn" data-save-modal>ซ่อนคอมเมนต์</button><button class="action" data-save-modal>ยกเลิก Report</button>`);
        return true;
      }

      if ((label === "View" || label === "ดู" || label === "ประวัติ Trigger" || label === "ปิดใช้งาน") && page === "alerts") {
        openModal("รายละเอียด Watch Alert - WA001", watchAlertDetail(), `<button class="action gray" data-close-modal>ปิด</button><button class="action warn" data-save-modal>ปิดใช้งาน Alert</button><button class="action" data-save-modal>บันทึก</button>`);
        return true;
      }

      if ((label === "View" || label === "ดู") && page === "directory") {
        openModal("รายละเอียดไดเรกทอรี", directoryDetail(), `<button class="action gray" data-close-modal>ปิด</button><button class="action" data-save-modal>บันทึก</button>`);
        return true;
      }

      if ((label === "Open" || label === "เปิด" || label === "มอบหมาย Ticket") && page === "support") {
        openModal("รายละเอียด Support Ticket - TK001", supportDetail(), `<button class="action gray" data-close-modal>ปิด</button><button class="action warn" data-save-modal>ส่งกลับไปขอข้อมูล</button><button class="action" data-save-modal>Resolve Ticket</button>`);
        return true;
      }

      if ((label.includes("Export") || label.includes("ส่งออก") || label === "รายละเอียด") && page === "reports") {
        openModal("รายละเอียดรายงาน", reportDetail(), `<button class="action gray" data-close-modal>ปิด</button><button class="action green" data-save-modal>ส่งออก Excel</button>`);
        return true;
      }

      if ((label === "Details" || label === "รายละเอียด") && page === "audit") {
        openModal("รายละเอียด Audit Log - AL001", auditDetail(), `<button class="action gray" data-close-modal>ปิด</button>`);
        return true;
      }

      if (["View", "Open", "Details", "Review Pending", "Trigger Logs", "ดู", "เปิด", "รายละเอียด", "ตรวจรายการค้าง", "ประวัติ Trigger"].includes(label)) {
        openModal(`รายละเอียด`, genericForm("Detail", [["รหัส", "AUTO-001"], ["สถานะ", "Pending"], ["เจ้าของ / ผู้ใช้", "Vintage Vault BKK"], ["หมายเหตุ", "รายละเอียดจำลองสำหรับ preview", "textarea"]]), `<button class="action gray" data-close-modal>ปิด</button>`);
        return true;
      }

      if (["Publish", "Unpublish", "Delete", "Suspend", "Force Expire", "Disable", "Inactive", "Change Status", "Send Notification", "Publish Article", "Schedule Publish", "Save Draft", "Save", "Export CSV", "Export Excel", "เผยแพร่", "ยกเลิกเผยแพร่", "ลบ", "ระงับ", "หมดอายุทันที", "ปิดใช้งาน", "เปลี่ยนสถานะ", "ส่งแจ้งเตือน", "เผยแพร่บทความ", "ตั้งเวลาเผยแพร่", "บันทึกร่าง", "บันทึก", "ส่งตรวจสอบ", "ส่งออก CSV", "ส่งออก Excel"].includes(label)) {
        openModal(`ยืนยันการดำเนินการ`, `<p class="sub" style="margin-top:0">นี่คือ preview flow สำหรับ action <strong style="color:var(--text)">${label}</strong> ในระบบจริง action นี้จะบันทึก Audit Log และอัปเดตผลบน FO ตาม BO/FO mapping</p>`, `<button class="action gray" data-close-modal>ยกเลิก</button><button class="action" data-save-modal>ยืนยัน</button>`);
        return true;
      }

      return false;
    }

    document.addEventListener("click", event => {
      if (event.target.closest("[data-close-modal]")) {
        closeModal();
        return;
      }

      if (event.target.closest("[data-save-modal]")) {
        closeModal();
        showToast("ดำเนินการสำเร็จใน prototype");
        return;
      }

      const backdrop = event.target.closest("#modalBackdrop");
      if (event.target.id === "modalBackdrop") {
        closeModal();
        return;
      }

      const button = event.target.closest("button");
      if (!button || button.closest("#nav") || backdrop) return;

      if (button.dataset.boardTab) {
        boardTab = button.dataset.boardTab;
        render("articles");
        return;
      }

      handleAction(button);
    });

    render();
  </script>
</body>
</html>
