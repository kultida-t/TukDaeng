<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TukDaeng Admin</title>
  <style>
    :root {
      --bg: #f4f4f5;
      --panel: #ffffff;
      --panel-2: #f1f3f6;
      --text: #15171a;
      --muted: #69717d;
      --line: #dce1e7;
      --line-strong: #c8d0da;
      --brand: #7f0000;
      --brand-2: #4f0000;
      --green: #15803d;
      --amber: #b45309;
      --blue: #1d4ed8;
      --red: #b91c1c;
      --shadow: 0 10px 28px rgba(21, 23, 26, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      letter-spacing: 0;
      overflow-x: hidden;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 0;
      background: #fff;
      color: var(--text);
    }
    .login-shell {
      width: 100%;
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(420px, .9fr);
      position: relative;
      overflow: hidden;
      border-radius: 0;
      background: #fff;
      box-shadow: none;
    }
    .login-chrome {
      display: none;
    }
    .chrome-dots { display: flex; gap: 7px; align-items: center; }
    .chrome-dots span {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      display: block;
      background: #ef4444;
    }
    .chrome-dots span:nth-child(2) { background: #f59e0b; }
    .chrome-dots span:nth-child(3) { background: #22c55e; }
    .chrome-url {
      justify-self: center;
      width: min(360px, 100%);
      height: 20px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: #f1f3f5;
      color: #6b7280;
    }
    .login-copy {
      padding: 46px clamp(56px, 7vw, 104px) 38px clamp(72px, 8.6vw, 132px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
      min-height: 100vh;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      color: #fff;
      background: #0f1720 url("assets/login-watch-hero.png") center / cover no-repeat;
    }
    .login-copy > * {
      width: min(560px, 100%);
    }
    .login-copy::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(90deg, rgba(5, 7, 12, 0.86) 0%, rgba(5, 7, 12, 0.58) 48%, rgba(5, 7, 12, 0.25) 100%),
        linear-gradient(0deg, rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0.08) 46%);
    }
    .login-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 18px;
    }
    .login-logo span {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: inline-grid;
      place-items: center;
      background: #fff;
      color: var(--brand);
      font-weight: 900;
    }
    .login-copy h1 { margin: 0; max-width: 560px; font-size: 36px; line-height: 1.18; }
    .login-copy p { max-width: 540px; color: #e5e7eb; line-height: 1.75; margin: 14px 0 0; }
    .hero-kicker {
      color: #fecaca;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .hero-line {
      width: 34px;
      height: 3px;
      background: #fff;
      border-radius: 999px;
      margin-top: 26px;
    }
    .login-card {
      background: #fff;
      color: var(--text);
      padding: 40px 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: none;
      min-width: 0;
      min-height: 100vh;
    }
    .login-card-inner {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
    }
    .brand-mark { color: var(--text); font-weight: 850; font-size: 31px; line-height: 1.15; margin-bottom: 8px; }
    .login-subtitle { color: var(--muted); margin: 0 0 18px; line-height: 1.55; font-size: 14px; }
    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
    }
    .login-options label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .login-options a { color: var(--brand); text-decoration: none; }
    .login-card .primary {
      min-height: 44px;
      border-radius: 999px;
    }
    .login-card .input {
      min-height: 43px;
      background: #eef5ff;
      border-color: #d5dfef;
    }
    .field { display: grid; gap: 6px; margin-top: 16px; }
    .field label { color: var(--muted); font-size: 13px; }
    .input, .select, .textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      background: #fff;
      color: var(--text);
      min-width: 0;
    }
    .textarea { min-height: 88px; resize: vertical; }
    .primary, .secondary, .danger, .ghost {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 9px 12px;
      font-weight: 650;
      min-height: 38px;
    }
    .primary { background: var(--brand); color: #fff; }
    .primary:hover { background: var(--brand-2); }
    .secondary { background: #fff; border-color: var(--line-strong); color: var(--text); }
    .danger { background: #fee2e2; border-color: #fecaca; color: var(--red); }
    .ghost { background: transparent; color: var(--muted); }
    .full { width: 100%; margin-top: 20px; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
    }
    .sidebar {
      background: #2b2b2b;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .side-head {
      padding: 18px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .side-head strong { display: block; color: #8b0000; font-size: 30px; line-height: 1; }
    .side-head small { color: #9ca3af; }
    .nav {
      padding: 22px 0 10px;
      overflow-y: auto;
      flex: 1;
    }
    .nav button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #c9c9c9;
      text-align: left;
      padding: 13px 18px;
      border-radius: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 1px;
      font-size: 15px;
    }
    .nav button.active,
    .nav button:hover {
      background: #3a2424;
      color: #fff;
    }
    .nav button.active { box-shadow: inset 4px 0 0 var(--brand); }
    .nav-main {
      min-height: 60px;
      font-size: 17px;
      color: #e5e7eb;
    }
    .nav-main .icon {
      width: 24px;
      display: inline-grid;
      place-items: center;
      color: #d1d5db;
      font-size: 21px;
      line-height: 1;
      flex: 0 0 24px;
    }
    .nav-main span:nth-child(2) {
      flex: 1;
      min-width: 0;
    }
    .nav-caret {
      color: #9ca3af;
      font-size: 14px;
      transform: rotate(-90deg);
      transition: transform .16s ease;
    }
    .nav-main.open .nav-caret { transform: rotate(0deg); }
    .nav-sub {
      display: grid;
      gap: 1px;
      margin: -2px 0 6px 54px;
      padding-left: 12px;
      border-left: 1px solid rgba(255,255,255,.12);
    }
    .nav-sub button {
      min-height: 38px;
      padding: 8px 12px;
      color: #bfc5ce;
      font-size: 14px;
    }
    .nav-sub button.active {
      background: rgba(127, 0, 0, .32);
      color: #fff;
      box-shadow: none;
    }
    .nav-section {
      color: #8f8f8f;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 15px 12px 6px;
      letter-spacing: .08em;
    }
    .nav button.child { padding-left: 22px; }
    .admin-box {
      border-top: 1px solid rgba(255,255,255,.1);
      padding: 12px;
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
    }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--brand);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
    }
    .admin-box small { color: #9ca3af; display: block; }
    .main { min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      min-height: 64px;
      padding: 12px 18px;
      background: #f7f7f8;
      border-bottom: 1px solid #e4d8d8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 3;
    }
    .mobile-menu { display: none; }
    .topbar h2 { margin: 0; font-size: 22px; }
    .topbar p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
    .content {
      padding: 18px;
      min-width: 0;
    }
    .grid { display: grid; gap: 14px; }
    .grid.cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-width: 0;
      box-shadow: 0 1px 2px rgba(21, 23, 26, .04);
    }
    .card h3 { margin: 0 0 10px; font-size: 15px; }
    .metric { display: grid; gap: 6px; }
    .metric span { color: var(--muted); font-size: 13px; }
    .metric strong { font-size: 26px; }
    .up { color: var(--green); }
    .down { color: var(--red); }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 14px;
    }
    .toolbar .input { max-width: 280px; }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 760px;
    }
    th, td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
      vertical-align: middle;
    }
    th { color: var(--muted); background: #fafbfc; font-weight: 650; }
    tr:hover td { background: #fafafa; }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid transparent;
    }
    .b-green { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
    .b-blue { background: #dbeafe; color: #1e40af; border-color: #bfdbfe; }
    .b-amber { background: #fef3c7; color: #92400e; border-color: #fde68a; }
    .b-red { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
    .b-gray { background: #f3f4f6; color: #374151; border-color: #e5e7eb; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .tab {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 7px 11px;
      color: var(--muted);
    }
    .tab.active { color: var(--brand); border-color: #fca5a5; background: #fff1f2; }
    .detail {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(280px, .7fr);
      gap: 14px;
      margin-top: 14px;
    }
    .kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .kv span:first-child { color: var(--muted); }
    .list { display: grid; gap: 9px; }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 10px;
      background: var(--panel-2);
      border-radius: 8px;
      min-width: 0;
    }
    .asset-titlebar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    .asset-titlebar h1 {
      margin: 0 0 4px;
      font-size: 26px;
      line-height: 1.2;
    }
    .asset-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .asset-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 304px;
      gap: 24px;
      align-items: start;
    }
    .gallery {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px;
      gap: 8px;
      margin-bottom: 24px;
    }
    .watch-photo {
      min-height: 500px;
      border: 1px solid #ead1d1;
      background:
        radial-gradient(circle at 50% 52%, rgba(255,255,255,.95) 0 16%, transparent 17%),
        radial-gradient(circle at 50% 52%, #d6d7d8 0 31%, transparent 32%),
        radial-gradient(circle at 50% 52%, #111 0 42%, transparent 43%),
        linear-gradient(135deg, #cfd2d4, #f6f7f7 38%, #6b6d70 70%, #111);
      position: relative;
      overflow: hidden;
    }
    .watch-photo:before {
      content: "";
      position: absolute;
      inset: 12% 16%;
      border: 16px solid rgba(15,15,15,.86);
      border-radius: 50%;
      box-shadow: inset 0 0 0 18px rgba(255,255,255,.35), 0 26px 70px rgba(0,0,0,.36);
    }
    .watch-photo:after {
      content: "ROLEX";
      position: absolute;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-weight: 800;
      font-size: 22px;
      letter-spacing: .16em;
      color: #777;
    }
    .thumbs { display: grid; gap: 8px; }
    .thumb {
      min-height: 120px;
      border: 1px solid #ead1d1;
      background: linear-gradient(135deg, #f7f7f7, #b9b9b9);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      position: relative;
      overflow: hidden;
    }
    .thumb.dark:before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.48);
    }
    .thumb.dark span { position: relative; }
    .info-card {
      background: #fff;
      border: 1px solid #dedede;
      padding: 24px;
      margin-bottom: 24px;
    }
    .info-card h3 {
      margin: 0 0 14px;
      font-size: 21px;
      border-bottom: 1px solid #d7b8b8;
      padding-bottom: 14px;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px 52px;
    }
    .detail-item span {
      display: block;
      color: #666;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 6px;
    }
    .detail-item strong {
      display: block;
      font-size: 16px;
    }
    .side-card {
      background: #fff;
      border: 1px solid #dedede;
      padding: 24px;
      margin-bottom: 24px;
    }
    .owner {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid #d7b8b8;
      margin-bottom: 16px;
    }
    .owner-photo {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      background: linear-gradient(135deg, #1f2937, #d1d5db);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
    }
    .admin-panel {
      background: #282828;
      color: #fff;
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }
    .admin-panel h3 { margin: 0 0 24px; letter-spacing: .08em; font-size: 16px; }
    .admin-panel label { display: block; color: #cfcfcf; font-size: 12px; margin-bottom: 8px; }
    .admin-panel .select { background: #e5e7eb; color: #222; border: 0; border-radius: 0; }
    .traffic {
      border-left: 4px solid var(--brand);
      background: #fff;
      padding: 24px;
      border-top: 1px solid #ead1d1;
      border-right: 1px solid #ead1d1;
      border-bottom: 1px solid #ead1d1;
    }
    .doc-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    .doc-tile {
      border: 1px solid #e8c5c5;
      min-height: 138px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
    }
    .row strong, .row span { min-width: 0; overflow-wrap: anywhere; }
    .progress { height: 7px; background: #e5e7eb; border-radius: 999px; overflow: hidden; }
    .progress > i { display: block; height: 100%; background: var(--brand); }
    .drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.38);
      z-index: 9;
    }

    @media (max-width: 1100px) {
      .grid.cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .detail { grid-template-columns: 1fr; }
      .asset-layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 820px) {
      .login { padding: 0; }
      .login-shell { grid-template-columns: 1fr; min-height: 0; }
      .login-copy { min-height: 46vh; padding: 34px 28px; }
      .login-copy > * { width: 100%; }
      .login-copy h1 { font-size: 28px; }
      .login-card { min-height: 54vh; padding: 32px 28px 36px; }
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: min(82vw, 310px);
        z-index: 10;
        transform: translateX(-105%);
        transition: transform .18s ease;
      }
      .sidebar.open { transform: translateX(0); }
      .drawer-backdrop.show { display: block; }
      .mobile-menu { display: inline-flex; }
      .topbar { align-items: flex-start; }
      .content { padding: 12px; }
      .grid.cards, .grid.two, .grid.three { grid-template-columns: 1fr; }
      .toolbar .input, .toolbar .select, .toolbar button { width: 100%; max-width: none; }
      .kv { grid-template-columns: 1fr; }
      .asset-titlebar { display: grid; }
      .asset-actions { justify-content: stretch; }
      .asset-actions button { flex: 1; }
      .gallery { grid-template-columns: 1fr; }
      .thumbs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .watch-photo { min-height: 330px; }
      .detail-grid, .doc-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 430px) {
      .topbar { padding: 10px 12px; }
      .topbar h2 { font-size: 17px; }
      .card { padding: 12px; }
      .metric strong { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const navGroups = [
      { id: "dashboard", title: "Dashboard", icon: "▦", screen: "dashboard", items: [] },
      { id: "users", title: "User Management", icon: "☷", screen: "users", items: [["users", "User List"], ["support", "Help / Support"], ["deletion", "Account Deletion"]] },
      { id: "assets", title: "Asset Management", icon: "◉", screen: "asset-detail", items: [["asset-detail", "Asset Details"], ["assets", "Asset List"], ["offers", "Offer / Chat"]] },
      { id: "content", title: "Content Management", icon: "▤", screen: "content", items: [["content", "Content Board"], ["directory", "Directory"], ["watch", "Watch Alert"]] },
      { id: "market", title: "Market Data", icon: "↗", screen: "market", items: [["market", "Market Data"], ["reports", "Reports"]] },
      { id: "settings", title: "Settings", icon: "⚙", screen: "settings", items: [["settings", "Admin Settings"], ["notifications", "Notifications"], ["social", "Social Moderation"], ["audit", "Audit Log"]] }
    ];
    const navItems = navGroups.flatMap(group => group.items.length ? group.items : [[group.screen, group.title]]);

    const state = { authed: false, step: "login", screen: "dashboard", menu: false, role: "Super Admin", openNav: "dashboard" };
    const root = document.getElementById("root");

    const users = [
      ["U-1001", "Vintage Vault BKK", "Email", "Active", "14", "2h ago"],
      ["U-1002", "horology.king", "Google", "Suspended", "22", "3d ago"],
      ["U-1003", "Sophie Patek", "Apple", "Active", "8", "30m ago"],
      ["U-1004", "The Collector", "Email", "Deletion Requested", "6", "1d ago"]
    ];
    const assets = [
      ["A-2001", "Patek Philippe", "Nautilus 5711/1A", "Sale", "1,200,000 THB", "Vintage Vault"],
      ["A-2002", "Rolex", "Submariner 116610LN", "Sale", "350,000 THB", "horology.king"],
      ["A-2003", "Audemars Piguet", "Royal Oak", "Show", "3,080,000 THB", "Vintage Vault"],
      ["A-2004", "Omega", "Speedmaster Pro", "Hide", "145,000 THB", "Sophie Patek"]
    ];
    const offers = [
      ["OF-301", "Patek Nautilus", "Buyer A", "Vintage Vault", "Pending", "1,050,000 THB"],
      ["OF-302", "Rolex Submariner", "Buyer B", "horology.king", "Rejected", "330,000 THB"],
      ["OF-303", "Omega Speedmaster", "Buyer C", "Sophie Patek", "Accepted", "142,000 THB"],
      ["OF-304", "IWC Pilot", "Buyer D", "The Collector", "Invalidated", "118,000 THB"]
    ];
    const tickets = [
      ["T-501", "Account / Login", "LINE", "High", "Open", "6h left"],
      ["T-502", "Offer / Chat", "Email", "Urgent", "In Progress", "1h left"],
      ["T-503", "Market Data", "Phone", "Medium", "Waiting User", "On track"]
    ];
    const reports = [
      ["User Report", "New users, DAU/MAU, auth method", "Super Admin", "CSV / Excel"],
      ["Asset Report", "Sale, Show, Hide, Sold, reported assets", "Moderator+", "CSV / Excel"],
      ["Offer Report", "Pending, Accepted, Rejected, Invalidated", "Super Admin", "CSV / Excel"],
      ["Support Report", "SLA 8h, ticket type, workload", "Support Admin", "CSV / Excel"],
      ["Notification Report", "Sent, delivered, opened, failed", "Super Admin", "CSV / Excel"]
    ];

    function badge(value) {
      const map = {
        Active: "b-green", Sale: "b-green", Accepted: "b-green", Sent: "b-green",
        Show: "b-blue", Open: "b-blue", "In Progress": "b-blue", Pending: "b-blue",
        Hide: "b-gray", "Waiting User": "b-amber", Medium: "b-amber", High: "b-amber",
        Suspended: "b-red", Rejected: "b-red", Invalidated: "b-red", Urgent: "b-red",
        "Deletion Requested": "b-amber"
      };
      return `<span class="badge ${map[value] || "b-gray"}">${value}</span>`;
    }

    function activeNavGroupId() {
      const group = navGroups.find(item => item.screen === state.screen || item.items.some(child => child[0] === state.screen));
      return group ? group.id : "dashboard";
    }
    function setScreen(id) {
      state.screen = id;
      state.openNav = activeNavGroupId();
      state.menu = false;
      render();
    }
    function toggleNavGroup(id) {
      const group = navGroups.find(item => item.id === id);
      if (!group) return;
      if (!group.items.length) {
        setScreen(group.screen);
        return;
      }
      if (state.openNav === id) {
        state.openNav = "";
      } else {
        state.screen = group.screen;
        state.openNav = id;
      }
      render();
    }
    function setAuthed(step) { state.step = step; if (step === "app") state.authed = true; render(); }
    function toggleMenu() { state.menu = !state.menu; render(); }

    function loginScreen() {
      const twoFa = state.step === "2fa";
      root.innerHTML = `
        <section class="login">
          <div class="login-shell">
            <div class="login-copy">
              <div class="login-logo"><span>TD</span> TukDaeng Admin</div>
              <div>
                <div class="hero-kicker">Back Office</div>
                <h1>จัดการสินทรัพย์นาฬิกาแบรนด์เนมอย่างเป็นระบบ</h1>
                <p>พื้นที่ทำงานสำหรับทีมปฏิบัติการ ตรวจสอบรายการขาย ดูแลสมาชิก ข้อเสนอ คอนเทนต์ และข้อมูลตลาดของตึกแดง</p>
                <div class="hero-line"></div>
              </div>
              <small>Secure admin workspace</small>
            </div>
            <div class="login-card">
              <div class="login-card-inner">
                <div class="brand-mark">${twoFa ? "ยืนยันตัวตน" : "Welcome Back"}</div>
                <p class="login-subtitle">${twoFa ? "กรอกรหัส 6 หลักจาก authenticator app เพื่อเข้าสู่ Back Office" : "ลงชื่อเข้าใช้เพื่อเข้าสู่ระบบจัดการหลังบ้านของ TukDaeng"}</p>
                ${twoFa ? `
                  <div class="field"><label>2FA code</label><input class="input" inputmode="numeric" placeholder="123456" /></div>
                  <button class="primary full" onclick="setAuthed('app')">ยืนยันและเข้าสู่ระบบ</button>
                  <button class="ghost full" onclick="setAuthed('login')">กลับไปหน้าเข้าสู่ระบบ</button>
                ` : `
                  <div class="field"><label>Email</label><input class="input" type="email" placeholder="admin@tukdaeng.co" /></div>
                  <div class="field"><label>Password</label><input class="input" type="password" placeholder="กรอกรหัสผ่าน" /></div>
                  <div class="login-options">
                    <label><input type="checkbox" /> Remember me</label>
                    <a href="javascript:void(0)">Forgot password?</a>
                  </div>
                  <button class="primary full" onclick="setAuthed('2fa')">เข้าสู่ระบบ</button>
                `}
              </div>
            </div>
          </div>
        </section>`;
    }

    function appShell() {
      const current = navItems.find(x => x[0] === state.screen) || navItems[0];
      root.innerHTML = `
        <div class="drawer-backdrop ${state.menu ? "show" : ""}" onclick="toggleMenu()"></div>
        <div class="app">
          <aside class="sidebar ${state.menu ? "open" : ""}">
            <div class="side-head"><strong>Tuk Daeng</strong><small>Back Office</small></div>
            <nav class="nav">
              ${navGroups.map(group => `
                <button class="nav-main ${activeNavGroupId() === group.id ? "active" : ""} ${state.openNav === group.id ? "open" : ""}" onclick="toggleNavGroup('${group.id}')">
                  <span class="icon">${group.icon}</span>
                  <span>${group.title}</span>
                  ${group.items.length ? `<span class="nav-caret">⌄</span>` : ""}
                </button>
                ${group.items.length && state.openNav === group.id ? `
                  <div class="nav-sub">
                    ${group.items.map(item => `<button class="child ${state.screen === item[0] ? "active" : ""}" onclick="setScreen('${item[0]}')"><span>${item[1]}</span></button>`).join("")}
                  </div>
                ` : ""}
              `).join("")}
            </nav>
            <div class="admin-box"><div class="avatar">SA</div><div><strong>Super Admin</strong><small>2FA enabled</small></div></div>
          </aside>
          <main class="main">
            <header class="topbar">
              <button class="secondary mobile-menu" onclick="toggleMenu()">Menu</button>
              <div><h2>Tuk Daeng Admin</h2><p>${current[1]} / ${subtitle(state.screen)}</p></div>
              <div style="display:flex;gap:8px;align-items:center"><button class="ghost" title="Notifications">Bell</button><select class="select" onchange="state.role=this.value;render()"><option>Super Admin</option><option>Moderator</option><option>Support Admin</option><option>Market Admin</option><option>Content Admin</option></select><button class="secondary" onclick="state.authed=false;state.step='login';render()">Logout</button></div>
            </header>
            <section class="content">${screenContent(state.screen)}</section>
          </main>
        </div>`;
    }

    function subtitle(id) {
      const text = {
        dashboard: "Overview, queues, SLA risk และ role visibility",
        users: "User list/detail, login history, suspend/ban/reset",
        assets: "Sale / Show / Hide / Sold และ moderation",
        "asset-detail": "Rolex Daytona",
        offers: "Offer lifecycle, chat context, status Rejected",
        support: "Ticket queue จาก LINE / Phone / Email",
        deletion: "30-day grace period, pending offer validation",
        notifications: "Broadcast, system triggers, delivery logs",
        reports: "Report catalog, export jobs, sensitive masking",
        settings: "Role matrix, security, retention, export policy"
      };
      return text[id] || "Module placeholder with shared BO patterns";
    }

    function metric(label, value, change) {
      return `<div class="card metric"><span>${label}</span><strong>${value}</strong><small class="${change.includes('-') ? 'down' : 'up'}">${change}</small></div>`;
    }

    function table(headers, rows) {
      return `<div class="table-wrap"><table><thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}<th>Action</th></tr></thead><tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${["Active","Sale","Show","Hide","Sold","Suspended","Pending","Accepted","Rejected","Invalidated","Open","In Progress","Waiting User","High","Urgent","Medium","Deletion Requested"].includes(cell) ? badge(cell) : cell}</td>`).join("")}<td><button class="secondary">View</button></td></tr>`).join("")}</tbody></table></div>`;
    }

    function dashboard() {
      return `
        <div class="grid cards">
          ${metric("New users today", "128", "+8.2%")}
          ${metric("Active assets", "3,847", "+12.4%")}
          ${metric("Offers today", "246", "+3.1%")}
          ${metric("SLA risk", "9", "-2 from yesterday")}
        </div>
        <div class="grid two" style="margin-top:14px">
          <div class="card"><h3>Pending queues</h3><div class="list">
            ${queue("Reported Assets", "7", "24h SLA", "assets")}
            ${queue("Open Support Tickets", "18", "8h first response", "support")}
            ${queue("Deletion Requests", "4", "2 blocked by pending offer", "deletion")}
            ${queue("Failed Notifications", "11", "retryable", "notifications")}
          </div></div>
          <div class="card"><h3>Activity feed</h3><div class="list">
            ${feed("Asset A-2002 flagged by Moderator", "15m ago")}
            ${feed("Offer OF-302 changed to Rejected", "1h ago")}
            ${feed("Watch Alert matched 6 Sale assets", "2h ago")}
            ${feed("Market Data sync completed", "3h ago")}
          </div></div>
        </div>
        <div class="grid three" style="margin-top:14px">
          <div class="card"><h3>Asset status</h3>${bar("Sale", 68)}${bar("Show", 18)}${bar("Hide", 9)}${bar("Sold", 5)}</div>
          <div class="card"><h3>Offer status</h3>${bar("Pending", 38)}${bar("Accepted", 24)}${bar("Rejected", 26)}${bar("Invalidated", 12)}</div>
          <div class="card"><h3>Role view</h3><p>Current role: <strong>${state.role}</strong></p><p style="color:var(--muted)">เมนูและสิทธิ์การทำงานปรับตาม role ของผู้ดูแลระบบ</p></div>
        </div>`;
    }

    function assetDetailPage() {
      return `
        <div class="asset-titlebar">
          <div>
            <h1>Rolex Cosmograph Daytona <span class="badge b-red" style="vertical-align:middle;margin-left:10px">FOR SALE</span> <span class="badge b-red" style="vertical-align:middle;margin-left:6px">URGENT</span></h1>
            <div style="color:var(--muted)">ID: ASSET-RX-7729-2024 • วันที่ลงประกาศ: 12 เม.ย. 2567</div>
          </div>
          <div class="asset-actions">
            <button class="secondary">Edit details</button>
            <button class="primary">Print documents</button>
          </div>
        </div>

        <div class="asset-layout">
          <div>
            <div class="gallery">
              <div class="watch-photo" aria-label="Rolex Daytona preview image"></div>
              <div class="thumbs">
                <div class="thumb">Bracelet</div>
                <div class="thumb dark"><span>+4 รูปภาพ</span></div>
              </div>
            </div>

            <div class="info-card">
              <h3>รายละเอียดสินทรัพย์ (Asset Details)</h3>
              <div class="detail-grid">
                ${assetField("แบรนด์ (Brand)", "Rolex")}
                ${assetField("รุ่น (Model)", "Cosmograph Daytona 116500LN")}
                ${assetField("ปีผลิต (Year)", "2022")}
                ${assetField("ราคาประเมิน (Price)", "฿ 1,250,000", true)}
                ${assetField("สภาพ (Condition)", "Mint (98%) - Full Set")}
                ${assetField("ตำแหน่งจัดเก็บ (Location)", "Safe Deposit Box #A-402 (HQ)")}
              </div>
            </div>

            <div class="info-card">
              <h3>หลักฐานการตรวจสอบ (Verification Documents)</h3>
              <div class="doc-grid">
                ${docTile("Proof of Payment", "Uploaded: 12/04/24")}
                ${docTile("Authentication Cert", "Verified by Expert #09")}
                ${docTile("Consignment Agrmt", "Signed PDF (3.2MB)")}
              </div>
            </div>
          </div>

          <aside>
            <div class="side-card">
              <h3 style="margin-top:0;letter-spacing:.12em;color:#666;font-size:16px">ข้อมูลเจ้าของ (OWNER)</h3>
              <div class="owner">
                <div class="owner-photo">VM</div>
                <div><strong>คุณ วิศรุต เมรานท์</strong><br><span style="color:var(--muted)">VIP Member - Gold Tier</span></div>
              </div>
              ${kv("เบอร์โทรศัพท์", "081-XXX-XXXX")}
              ${kv("อีเมล", "wissarut@email.com")}
              ${kv("ประวัติการขาย", "14 รายการ (สำเร็จ)")}
              <button class="secondary full">ดูโปรไฟล์สมาชิก</button>
            </div>

            <div class="admin-panel">
              <h3>สำหรับผู้ดูแลระบบ</h3>
              <label>เปลี่ยนสถานะ (Force Status)</label>
              <select class="select"><option>ขายแล้ว (Sold)</option><option>Sale</option><option>Show</option><option>Hide</option></select>
              <div class="row" style="background:transparent;color:#fff;border-bottom:1px solid #444;border-radius:0;margin:18px 0 24px;padding:0 0 14px"><span>ปักหมุดสินทรัพย์พิเศษ</span><span style="color:#ff8a80">Flag</span></div>
              <button class="danger full">ลบสินทรัพย์ (Soft Delete)</button>
              <button class="secondary full" style="background:#2f2f2f;color:#fff;border-color:#6b5a5a">บันทึกกิจกรรม (Logs)</button>
            </div>

            <div class="traffic">
              <small style="color:var(--muted);text-transform:uppercase;letter-spacing:.08em">การเข้าชม (Traffic)</small>
              <div style="display:flex;align-items:end;justify-content:space-between;margin-top:10px">
                <strong style="font-size:26px">4,219 <span style="font-size:12px;font-weight:400;color:var(--muted)">ครั้ง</span></strong>
                <span style="color:var(--brand);font-weight:800">+12%<br><small style="color:var(--muted);font-weight:400">สัปดาห์นี้</small></span>
              </div>
            </div>
          </aside>
        </div>`;
    }

    function assetField(label, value, red) {
      return `<div class="detail-item"><span>${label}</span><strong style="${red ? "color:var(--brand)" : ""}">${value}</strong></div>`;
    }
    function docTile(title, meta) {
      return `<div class="doc-tile"><strong style="color:var(--brand);font-size:24px">Doc</strong><strong>${title}</strong><small style="color:var(--muted)">${meta}</small></div>`;
    }

    function queue(name, value, note, target) {
      return `<button class="row" onclick="setScreen('${target}')"><strong>${name}</strong><span>${value} - ${note}</span></button>`;
    }
    function feed(text, time) { return `<div class="row"><span>${text}</span><small>${time}</small></div>`; }
    function bar(label, pct) { return `<div style="margin:10px 0"><div class="row" style="background:transparent;padding:0"><span>${label}</span><strong>${pct}%</strong></div><div class="progress"><i style="width:${pct}%"></i></div></div>`; }

    function usersPage() {
      return standardPage("Users", ["User ID","Name","Auth","Status","Assets","Last active"], users, `
        <div class="detail">
          <div class="card"><h3>User detail preview</h3>${kv("User", "Vintage Vault BKK")}${kv("Status", badge("Active"))}${kv("Auth", "Email / Password + verified")}${kv("FO impact", "Suspend/Ban blocks login and public actions")}</div>
          <div class="card"><h3>Admin actions</h3><div class="list"><button class="danger">Suspend user</button><button class="secondary">Reset password</button><button class="secondary">Open support tickets</button></div></div>
        </div>`);
    }
    function assetsPage() {
      return standardPage("Assets", ["Asset ID","Brand","Model","Status","Price","Owner"], assets, `
        <div class="detail">
          <div class="card"><h3>Visibility matrix</h3>${kv("Sale", "Feed / Search / Watch Alert")}${kv("Show", "Public profile/detail only")}${kv("Hide", "Owner-only")}${kv("Sold", "Owner sold history")}</div>
          <div class="card"><h3>Moderation</h3><p style="color:var(--muted)">Status uses Show / Hide from FO. Legacy Collection Show/Hide is normalized.</p><button class="danger">Hide asset with reason</button></div>
        </div>`);
    }
    function offersPage() {
      return standardPage("Offer / Chat", ["Offer ID","Asset","Buyer","Owner","Status","Amount"], offers, `
        <div class="detail">
          <div class="card"><h3>Status contract</h3>${kv("FO action", "Decline")}${kv("BO/API status", badge("Rejected"))}${kv("System state", "Expired / Invalidated")}${kv("Deletion dependency", "Pending offers block account archive")}</div>
          <div class="card"><h3>Chat context</h3><p style="color:var(--muted)">Reported chat, attachment scan, transcript export and offer card context.</p><button class="secondary">Open chat transcript</button></div>
        </div>`);
    }
    function supportPage() {
      return standardPage("Help / Support", ["Ticket ID","Type","Channel","Priority","Status","SLA"], tickets, `
        <div class="detail">
          <div class="card"><h3>Ticket detail</h3>${kv("Requester", "User U-1004")}${kv("Contact", "LINE @mrfoxthailand")}${kv("SLA", "First response 8 hours")}${kv("Internal note", "Not visible to FO")}</div>
          <div class="card"><h3>Reply panel</h3><textarea class="textarea">สวัสดีครับ ทีม Support กำลังตรวจสอบให้...</textarea><button class="primary full">Send reply</button></div>
        </div>`);
    }
    function deletionPage() {
      const rows = [
        ["DEL-701", "The Collector", "Deactivated", "Blocked", "2", "22 days left"],
        ["DEL-702", "Old Account", "Archived", "Archived", "0", "Completed"],
        ["DEL-703", "Support Case", "Deactivated", "Requested", "0", "28 days left"]
      ];
      return standardPage("Account Deletion", ["Request ID","User","Account Status","Request Status","Pending Offers","Grace Period"], rows, `
        <div class="detail">
          <div class="card"><h3>Validation</h3>${kv("Pending offer rule", "Block archive/anonymization")}${kv("Grace period", "30 days")}${kv("FO result", "Login blocked, public profile/assets hidden")}</div>
          <div class="card"><h3>Archive plan</h3><p>Hide public profile, retain offer/chat records, anonymize personal fields by policy.</p><button class="secondary">Recheck conditions</button></div>
        </div>`);
    }
    function notificationsPage() {
      const rows = [
        ["N-801", "Broadcast", "Pending Approval", "All active members", "Scheduled"],
        ["N-802", "Watch Alert", "Sent", "Alert owner", "Watch Alert Result List"],
        ["N-803", "Offer Rejected", "Delivered", "Buyer", "Asset Detail"],
        ["N-804", "New Message", "Skipped", "Chat participants", "Chat badge only"]
      ];
      return standardPage("Notifications", ["ID","Type","Status","Recipient","Destination"], rows, `
        <div class="detail">
          <div class="card"><h3>FO V1 supported types</h3>${kv("Allowed", "Like, Comment, Follow, Offer, Watch Alert")}${kv("Chat/New Message", "Chat badge only")}${kv("Broadcast in-app", "Needs master decision")}</div>
          <div class="card"><h3>Delivery controls</h3><button class="secondary">Retry failed</button><button class="primary" style="margin-left:8px">Create broadcast</button></div>
        </div>`);
    }
    function reportsPage() {
      return standardPage("Reports", ["Report","Scope","Role","Export"], reports, `
        <div class="detail">
          <div class="card"><h3>Export job</h3>${kv("Formats", "CSV / Excel")}${kv("Large export", "Background job")}${kv("Sensitive fields", "Masked by default + audit")}</div>
          <div class="card"><h3>QA checks</h3><p>Report catalog must cover User, Asset, Offer, Chat, Board, Social, Search, Watch Alert, Support, Notification, Account Deletion.</p></div>
        </div>`);
    }
    function settingsPage() {
      const rows = [
        ["Super Admin", "Full", "Mandatory", "All modules"],
        ["Content Admin", "Board full", "Mandatory", "Content reports"],
        ["Moderator", "Moderation scoped", "Recommended", "Reports / queues"],
        ["Support Admin", "Support scoped", "Recommended", "Tickets / users"],
        ["Market Admin", "Market scoped", "Recommended", "Market data / directory"]
      ];
      return standardPage("Admin Settings", ["Role","Permission","2FA","Scope"], rows, `
        <div class="detail">
          <div class="card"><h3>Security policy</h3>${kv("Login", "Email/password only")}${kv("Idle timeout", "8 hours")}${kv("Max session", "24 hours")}${kv("Failed login", "5 attempts, lock 15 minutes")}</div>
          <div class="card"><h3>System defaults</h3>${kv("Timezone", "Asia/Bangkok")}${kv("Currency", "THB")}${kv("Language", "Thai primary")}${kv("Secrets", "Not visible in BO UI")}</div>
        </div>`);
    }

    function standardPage(title, headers, rows, extra) {
      return `
        <div class="toolbar">
          <input class="input" placeholder="Search ${title}" />
          <select class="select"><option>Today</option><option>7 days</option><option>30 days</option><option>Custom</option></select>
          <select class="select"><option>All statuses</option><option>Active</option><option>Pending</option><option>Reported</option></select>
          <button class="secondary">Export</button>
          <button class="primary">Create / Action</button>
        </div>
        ${table(headers, rows)}
        ${extra || ""}
      `;
    }

    function kv(k, v) { return `<div class="kv"><span>${k}</span><strong>${v}</strong></div>`; }

    function placeholder(id) {
      const item = navItems.find(x => x[0] === id);
      return `
        <div class="grid cards">
          ${metric("Records", "1,248", "+4.2%")}
          ${metric("Pending review", "18", "-6 today")}
          ${metric("Exports", "7", "+2")}
          ${metric("Audit events", "94", "+12")}
        </div>
        <div class="card" style="margin-top:14px">
          <h3>${item ? item[1] : "Module"}</h3>
          <p style="color:var(--muted);max-width:860px;line-height:1.7">หน้าจอนี้ใช้รูปแบบการทำงานกลางของ Back Office: รายการข้อมูล, ตัวกรอง, หน้ารายละเอียด, action ตามสิทธิ์, export และ audit context</p>
          <div class="tabs"><button class="tab active">List</button><button class="tab">Detail</button><button class="tab">Audit</button><button class="tab">Export</button></div>
          ${table(["ID","Name","Status","Owner","Updated"], [["M-001","Sample record","Active","System","Today"],["M-002","Review item","Pending","Admin","Yesterday"],["M-003","Archived item","Hide","System","Last week"]])}
        </div>`;
    }

    function screenContent(id) {
      if (id === "dashboard") return dashboard();
      if (id === "asset-detail") return assetDetailPage();
      if (id === "users") return usersPage();
      if (id === "assets") return assetsPage();
      if (id === "offers") return offersPage();
      if (id === "support") return supportPage();
      if (id === "deletion") return deletionPage();
      if (id === "notifications") return notificationsPage();
      if (id === "reports") return reportsPage();
      if (id === "settings") return settingsPage();
      return placeholder(id);
    }

    function render() {
      if (!state.authed) loginScreen();
      else appShell();
    }
    window.setAuthed = setAuthed;
    window.setScreen = setScreen;
    window.toggleMenu = toggleMenu;
    window.toggleNavGroup = toggleNavGroup;
    render();
  </script>
</body>
</html>
