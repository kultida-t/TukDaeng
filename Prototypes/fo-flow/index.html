    let hits = 0;
    list.querySelectorAll(".pfl-row").forEach(b => {
      const t = b.querySelector(".mn").textContent + " " + (b.querySelector(".md") ? b.querySelector(".md").textContent : "");
      const show = !q || t.toLowerCase().includes(q);
      b.style.display = show ? "" : "none";
      if (show) hits++;
    });
    list.querySelector(".pfl-none").style.display = hits ? "none" : "";
  }
  /* search page — live suggestions (SEARCH-001) */
  if (e.target.matches(".sr-q")) {
    const scr = e.target.closest(".screen");
    const S = srchState(scr);
    S.q = e.target.value;
    e.target.closest(".sr-field").classList.toggle("has-q", !!e.target.value);
    const body = scr.querySelector(".page-sub .sr-body");
    if (body) body.innerHTML = S.q.trim() ? suggestHTML(S) : recentHTML(S);
  }
  /* saved/wishlist page — live filter within collection posts (SAVED-001) */
  if (e.target.matches(".svd-q")) {
    const scr = e.target.closest(".screen");
    const V = colState(scr);
    V.q = e.target.value;
    e.target.closest(".sr-field").classList.toggle("has-q", !!V.q.trim());
    const body = scr.querySelector(".page-sub .svd-body");
    if (body) body.innerHTML = isWl(scr) ? wlSearchBodyHTML(scr) : savedSearchBodyHTML(scr);
  }
  /* new collection sheet — counter, clear-X, Next enable (SAVED-001) */
  if (e.target.matches(".nc-input")) {
    const f = e.target.closest(".nc-field");
    f.classList.toggle("has-v", !!e.target.value);
    f.querySelector(".nc-count").textContent = `${e.target.value.length} / 40`;
    const next = e.target.closest(".comment-sheet").querySelector(".nc-next");
    if (next) next.disabled = !e.target.value.trim();
  }
  /* price inputs — auto comma format, digits only (SEARCH-001 spec §12) */
  if (e.target.matches(".flt-pmin, .flt-pmax")) {
    const v = unNum(e.target.value);
    e.target.value = v ? fmtNum(v) : "";
  }
});

/* saved/wishlist grid — long-press a tile to enter select mode (IG) */
document.getElementById("stage").addEventListener("contextmenu", e => {
  const tile = e.target.closest(".svd-tile");
  if (!tile) return;
  const scr = tile.closest(".screen");
  const V = colState(scr);
  if (V.manage) return;
  e.preventDefault();
  const longTop = (scr._subStack || []).at(-1);
  if (longTop === "saved" || longTop === "wishlist") V.mode = "allposts";
  V.manage = true; V.sel.clear(); V.sel.add(tile.dataset.pid);
  renderSub(scr);
});

document.getElementById("stage").addEventListener("click", e => {
  const flow = e.target.closest("[data-flow]");
  if (flow) { openSub(flow.closest(".screen"), "create"); return; }
  /* ===== CREATE-001 — in-app create-post task flow (picker → caption → feed) ===== */
  const cf = e.target.closest(".cf");
  if (cf) {
    const scr = cf.closest(".screen");
    const V = cpState(scr);
    const cfX = e.target.closest(".cf-x");
    if (cfX) {
      if (V.order.length || V.caption.trim()) {
        openDlg(scr, `
          <div class="dlg-q">Discard post?</div>
          <div class="dlg-desc">If you go back now, you'll lose your draft.</div>
          <button class="dlg-btn danger dlg-discard-go">Discard post</button>
          <button class="dlg-btn dlg-cancel">Keep editing</button>`);
      }
      else { scr._subStack = []; scr.classList.remove("sub-open"); }
      return;
    }
    const cfNx = e.target.closest(".cf-next");
    if (cfNx) {
      if (!cfNx.classList.contains("off")) {
        V.step = 2;
        cf.querySelector(".cf-step2").outerHTML = cfStep2HTML(scr);
        cf.classList.add("cap-open");
      }
      return;
    }
    /* FEED-024 edit mode — Cancel / Done / add-media tile / picker back → caption */
    const cfEditX = e.target.closest(".cf-edit-x");
    if (cfEditX) {
      openDlg(scr, `
        <div class="dlg-q">Discard changes?</div>
        <div class="dlg-desc">If you go back now, your edits will be lost.</div>
        <button class="dlg-btn danger dlg-discard-go">Discard</button>
        <button class="dlg-btn dlg-cancel">Keep editing</button>`);
      return;
    }
    const cfDone = e.target.closest(".cf-done");
    if (cfDone) {
      const post = findPost(V.editPid);
      const wasDetail = V.editFromDetail;
      V.caption = scr.querySelector(".cf .ig-cap-line .ta")?.textContent.trim() ?? V.caption;
      if (post) applyPostEdit(scr, post, V); /* before _cp reset — cfMedia reads V.order */
      cfClipStop(scr);
      scr._cp = null;
      scr._subStack = [];
      scr.classList.remove("sub-open");
      if (post) {
        refreshPostViews(scr, post);
        if (wasDetail) openPostDetail(scr, post); /* reopens detail with fresh content */
        scrToast(scr, "Post updated", post.photos[0] || "");
      }
      return;
    }
    const cfAdd = e.target.closest(".ig-add");
    if (cfAdd) { V._orderSnap = V.order.slice(); V.step = 1; renderSub(scr); return; }
    /* add-media picker — < cancels the additions, Done keeps them */
    const cfAddCancel = e.target.closest(".cf-add-cancel");
    if (cfAddCancel) { if (V._orderSnap) { V.order = V._orderSnap; V._orderSnap = null; } V.step = 2; renderSub(scr); return; }
    const cfAddDone = e.target.closest(".cf-add-done");
    if (cfAddDone) { V._orderSnap = null; V.step = 2; renderSub(scr); return; }
    const cfBk = e.target.closest(".cf-back2");
    if (cfBk) {
      V.step = 1;
      cf.classList.remove("cap-open");
      return;
    }
    const cfSel = e.target.closest("[data-selmode]");
    if (cfSel) { V.sel = !V.sel; renderSub(scr); return; }
    const cfRm = e.target.closest(".rm-mini");
    if (cfRm) {
      cfClipStop(scr);
      if (V.editPid && V.order.length <= 1) { scrToast(scr, "Post needs at least 1 photo or clip"); return; }
      V.order.splice(+cfRm.dataset.i, 1); if (!V.order.length) V.step = 1;
      renderSub(scr);
      return;
    }
    const cfZoom = e.target.closest(".ig-zoom");
    if (cfZoom && !suppressPhotoClick) {
      /* clip zoom — tap media toggles play, tap backdrop closes (same as photos) */
      if (e.target === cfZoom) { cfZoom.classList.remove("open"); cfClipStop(scr); V.viewClip = null; return; }
      if (cfZoom.classList.contains("is-clip")) { cfClipToggle(scr); return; }
    }
    const cfThumb = e.target.closest(".ig-thumb img");
    if (cfThumb && !suppressPhotoClick) {
      const z = cf.querySelector(".ig-zoom");
      const actClip = cfActiveClip(scr);
      /* lone-video draft — the baked clip viewer */
      if (actClip) {
        z.querySelector("img").src = actClip.src;
        z.querySelector(".z-dots").innerHTML = "";
        z.classList.add("open");
        cfClipSync(scr);
        return;
      }
      /* mixed/photo draft — cfZoomGo picks photo vs playable-clip mode per item */
      const th = cfThumb.closest(".ig-thumb");
      const i = [...th.parentElement.children].filter(c => c.classList.contains("ig-thumb")).indexOf(th);
      cfZoomGo(z, i, cfMedia(scr).length);
      z.classList.add("open");
      return;
    }
    const cfShare = e.target.closest(".cf-share");
    if (cfShare) {
      if (cfShare.classList.contains("off")) return;
      V.caption = scr.querySelector(".cf .ig-cap-line .ta")?.textContent.trim() || V.caption;
      const clip = cfActiveClip(scr);
      const photos = clip ? [clip.src] : cfPhotos(scr);
      const clips = clip ? [clip.dur] : cfMedia(scr).map(m => m.dur || null);
      insertNewPost({ photos, caption: V.caption, meta: V.meta, clip: clip ? clip.dur : null, clips });
      cfClipStop(scr);
      scr._cp = null;
      scr._subStack = [];
      scr.classList.remove("sub-open");
      const fs = scr.querySelector(".feed-scroll");
      fs.innerHTML = feedContentHTML(scr.dataset.variant);
      fs.scrollTop = 0;
      scrToast(scr, clip ? "Clip shared to feed ✓" : "Posted · shared to feed ✓", photos[0] || "");
      const waHits = POSTS[0]._waHits || [];
      if (waHits.length)
        setTimeout(() => scrToast(scr, `Watch alert matched: ${waHits[0]}${waHits.length > 1 ? ` +${waHits.length - 1} more` : ""}`), 2100);
      return;
    }
    const cfCell = e.target.closest(".ig-grid .cell");
    if (cfCell && !cfCell.classList.contains("cam")) {
      const i = +cfCell.dataset.i;
      const grid = cfCell.closest(".ig-grid");
      cfClipStop(scr);
      if (grid.classList.contains("selmode")) {
        const k = V.order.indexOf(i);
        if (k < 0) {
          if (V.order.length >= CF_MAX_MEDIA) { scrToast(scr, `You can add up to ${CF_MAX_MEDIA} photos or clips`); return; }
          V.order.push(i);
        } else V.order.splice(k, 1);
        grid.querySelectorAll(".cell[data-i]").forEach(c => {
          const pos = V.order.indexOf(+c.dataset.i);
          const r = c.querySelector(".radio");
          c.classList.toggle("sel", pos >= 0);
          r.classList.toggle("on", pos >= 0);
          r.textContent = pos >= 0 ? pos + 1 : "";
        });
      } else {
        V.order = [i];
        grid.querySelectorAll(".cell[data-i]").forEach(c => c.classList.toggle("sel", +c.dataset.i === i));
      }
      const cfNext = cf.querySelector(".cf-next");
      const lastM = V.order.length ? cfMedia(scr).at(-1) : null;
      cf.querySelector("[data-hero]").innerHTML = !lastM
        ? `<div class="add-tile">${I.camPlain(38)}<span>Select photos</span></div>`
        : lastM.dur
        ? `<div class="ig-car"><img src="${lastM.src}"><span class="clip-play">${I.play(26)}</span><span class="dur">${I.play(10)}${lastM.dur}</span></div>`
        : `<div class="ig-car"><img src="${lastM.src}"><button class="expand">${I.expandIc(15)}</button></div>`;
      if (cfNext) cfNext.classList.toggle("off", !V.order.length);
      return;
    }
    const cfSw = e.target.closest(".sw");
    if (cfSw && !cfSw.classList.contains("pane-sw")) { V.asset = !V.asset; cfSw.classList.toggle("on", V.asset); return; }
    const cfChip = e.target.closest(".ig-chip");
    if (cfChip && !suppressPhotoClick) {
      const tag = cfChip.dataset.tag;
      const ta = cf.querySelector(".ig-cap-line .ta");
      if (ta && !ta.textContent.includes(tag)) {
        ta.textContent = (ta.textContent.trimEnd() ? ta.textContent.trimEnd() + " " : "") + tag;
        V.caption = ta.textContent;
      }
      return;
    }
    /* clear picked location via the X inside the row */
    const cfLocX = e.target.closest(".loc-x");
    if (cfLocX) {
      V.meta.loc = "";
      cfLocX.closest(".ig-row").outerHTML = `<button class="ig-row" data-pane="loc"><span class="ic">${I.pin(19)}</span>Add location<span class="val"></span>${I.chevR(15)}</button>`;
      const note = cf.querySelector(".row-note");
      if (note) note.remove();
      return;
    }
    /* option rows → slide-in pane (location / price / details / condition / more) */
    const cfRow = e.target.closest(".ig-row[data-pane]");
    if (cfRow) {
      V.meta.pane = cfRow.dataset.pane;
      const pane = cf.querySelector(".cf-pane");
      pane.innerHTML = cfPaneHTML(scr);
      void pane.offsetWidth;
      pane.classList.add("open");
      return;
    }
    const cfPaneBack = e.target.closest(".cf-pane-back, .pane-done");
    if (cfPaneBack) {
      V.meta.pane = null;
      cf.querySelector(".cf-pane").classList.remove("open");
      cf.querySelector(".cf-step2").outerHTML = cfStep2HTML(scr);
      cfClipSync(scr);
      return;
    }
    const cfOpt = e.target.closest(".loc-opt, .cond-opt");
    if (cfOpt) {
      const v = cfOpt.dataset.v;
      const close = cfOpt.classList.contains("loc-opt");
      if (cfOpt.classList.contains("loc-opt")) { V.meta.loc = v; V.meta.locQ = ""; }
      else if (cfOpt.classList.contains("aud-opt")) {
        V.meta.audience = v;
        cf.querySelectorAll(".aud-opt").forEach(b => b.classList.toggle("on", b.dataset.v === v));
      }
      else if (cfOpt.classList.contains("box-opt")) {
        V.meta.box = V.meta.box === v ? "" : v;
        cf.querySelectorAll(".box-opt").forEach(b => b.classList.toggle("on", b.dataset.v === V.meta.box));
      }
      else {
        V.meta.cond = v;
        cf.querySelectorAll(".cond-opt:not(.box-opt)").forEach(b => b.classList.toggle("on", b.dataset.v === v));
      }
      if (close) {
        V.meta.pane = null;
        cf.querySelector(".cf-pane").classList.remove("open");
        cf.querySelector(".cf-step2").outerHTML = cfStep2HTML(scr);
        cfClipSync(scr);
      }
      return;
    }
    const cfPaneSw = e.target.closest(".pane-sw");
    if (cfPaneSw) {
      const f = cfPaneSw.dataset.f;
      V.meta[f] = f === "allowOffers" ? V.meta[f] === false : !V.meta[f];
      cfPaneSw.classList.toggle("on", V.meta[f]);
      return;
    }
    const cfDead = e.target.closest(".rc, .expand, .cell.cam");
    if (cfDead) { toast("Not in this prototype yet"); return; }
    return;
  }
  const pmBtn = e.target.closest(".post-head .more, .pm-btn");
  if (pmBtn) {
    const scr = pmBtn.closest(".screen");
    const art = pmBtn.closest(".post");
    scr.dataset.pmPid = art ? art.dataset.pid : scr.dataset.detailPid;
    const post = findPost(scr.dataset.pmPid);
    const cs = scr.querySelector(".comment-sheet");
    cs.classList.remove("uf", "pm-rp", "lk", "sh", "sv", "nt", "ps");
    cs.classList.add("pm");
    cs.innerHTML = isOwnPost(post) ? pmOwnMenuHTML(post) : pmMenuHTML(post);
    scr.classList.add("pm-open");

  /* ===== FEED-024 — own-post "..." menu actions (memory only) ===== */
  const pmOwn = e.target.closest(".pm-own-archive, .pm-own-nocomm, .pm-own-edit, .pm-own-pin, .pm-own-del");
  if (pmOwn) {
    const scr = pmOwn.closest(".screen");
    const post = findPost(scr.dataset.pmPid);
    scr.classList.remove("pm-open");
    if (!post) return;
    if (pmOwn.matches(".pm-own-archive")) {
      post.archived = !post.archived;
      post.archivedAt = post.archived ? Date.now() : 0;
      scr.querySelector(".feed-scroll").innerHTML = feedContentHTML(scr.dataset.variant);
      const top = (scr._subStack || []).at(-1) || "";
      if (top === "archive" || top.startsWith("profile:")) renderSub(scr);
      scr.querySelectorAll(`.pfp-post[data-pid="${post.id}"]`).forEach(el => el.remove());
      scrToast(scr, post.archived ? "Post archived" : "Post unarchived");
    } else if (pmOwn.matches(".pm-own-nocomm")) {
      post.noComments = !post.noComments;
      refreshPostViews(scr, post);
      scrToast(scr, post.noComments ? "Commenting turned off" : "Commenting turned on");
    } else if (pmOwn.matches(".pm-own-edit")) {
      openPostEdit(scr, post);
    } else if (pmOwn.matches(".pm-own-pin")) {
      post.pinned = !post.pinned;

        <div class="dlg-desc">This post will be permanently deleted.</div>

        <button class="dlg-btn dlg-cancel">Cancel</button>`);

    const wl = inWlCol(scr);
    const n = V.addSel.size;
    V.addSel.forEach(pid => { const p = POSTS.find(x => x.id === pid); if (p) { p[wl ? "wlCol" : "savedCol"] = V.col; p[wl ? "wlColAt" : "colAt"] = Date.now(); } });
    V.addSel.clear(); V.mode = "";
    renderSub(scr);
    if (n) scrToast(scr, n === 1 ? "Added 1 post" : `Added ${n} posts`);
    return;
  }
  const svdTile = e.target.closest(".svd-tile");
  if (svdTile) {
    const scr = svdTile.closest(".screen");
    const pid = svdTile.dataset.pid;
    if (svdTile.closest(".arc-grid")) { /* FEED-024 — archive tiles open the Archive viewer */
      openPostViewer(scr, archivePosts(), pid, 0, true, "Archive");
      return;
    }
    const V = colState(scr);
    if (V.mode === "add") {
      const sel = svdTile.querySelector(".svd-sel");
      if (V.addSel.has(pid)) { V.addSel.delete(pid); svdTile.classList.remove("on"); if (sel) sel.innerHTML = ""; }
      else { V.addSel.add(pid); svdTile.classList.add("on"); if (sel) sel.innerHTML = I.check(12); }
      const t = scr.querySelector(".svd-addtitle");
      if (t) t.innerHTML = V.addSel.size ? `${V.addSel.size} Selected` : `${isWl(scr) ? "Wish List" : "Saved"}<span class="svd-addsub">Add from</span>`;
      return;
    }
    if (V.manage) {
      const sel = svdTile.querySelector(".svd-sel");
      if (V.sel.has(pid)) { V.sel.delete(pid); svdTile.classList.remove("on"); if (sel) sel.innerHTML = ""; }
      else { V.sel.add(pid); svdTile.classList.add("on"); if (sel) sel.innerHTML = I.check(12); }
      const sub = scr.querySelector(".page-sub");
      const sa = sub.querySelector(".svd-selall");
      if (sa) sa.textContent = V.sel.size >= colList(scr).length ? "Deselect all" : "Select all";
      sub.querySelectorAll(".svd-bar button").forEach(b => b.disabled = !V.sel.size);
      return;
    }
    if (isWl(scr)) openPostViewer(scr, colList(scr), pid, 0, true, "Wish List");
    else openPostViewer(scr, savedList(scr), pid, 0, true);
    return;
  }
  const svdMove = e.target.closest(".svd-move");
  if (svdMove) {
    const scr = svdMove.closest(".screen");
    openSheet(scr, "sv", "save-open", isWl(scr) ? wlMoveSheetHTML(scr) : svdMoveSheetHTML(scr));
    return;
  }
  const svdMv = e.target.closest(".svd-mv");
  if (svdMv) {
    const scr = svdMv.closest(".screen");
    const V = colState(scr);
    const wl = isWl(scr);
    const col = svdMv.dataset.col;
    const inCol = (scr._subStack || []).at(-1) === "savedcol" || inWlCol(scr);
    const firstP = POSTS.find(x => V.sel.has(x.id));
    V.sel.forEach(pid => { const p = POSTS.find(x => x.id === pid); if (p) { p[wl ? "wlCol" : "savedCol"] = col; p[wl ? "wlColAt" : "colAt"] = Date.now(); } });
    V.sel.clear(); V.manage = false;
    scr.classList.remove("save-open");
    renderSub(scr);
    scrToast(scr, inCol ? `Moved to ${col}` : `Added to ${col}`, firstP ? thumbS(firstP) : "");
    return;
  }
  const svdMvNew = e.target.closest(".svd-mv-new");
  if (svdMvNew) {
    const scr = svdMvNew.closest(".screen");
    const V = colState(scr);
    scr._ncFrom = isWl(scr) ? "wlmove" : "move"; scr._ncPids = [...V.sel];
    const fp = POSTS.find(x => x.id === scr._ncPids[0]);
    openSheet(scr, "nc", "save-open", ncSheetHTML("", fp ? thumbS(fp) : ""));
    scr.querySelector(".nc-input").focus({ preventScroll: true });
    return;
  }
  const svdUnsave = e.target.closest(".svd-unsave");
  if (svdUnsave && !svdUnsave.disabled) {
    const scr = svdUnsave.closest(".screen");
    const V = colState(scr);
    const wl = isWl(scr);
    const inCol = (scr._subStack || []).at(-1) === "savedcol" || inWlCol(scr);
    if (inCol) {
      openDlg(scr, `
        <div class="dlg-q">Remove from this collection?</div>
        <div class="dlg-desc">${wl ? "Post will still be on your wish list." : "Post will still be saved in all posts."}</div>
        <button class="dlg-btn danger dlg-rmcol-go">Remove</button>
        <button class="dlg-btn dlg-cancel">Cancel</button>`);
      return;
    }
    openDlg(scr, wl ? `
      <div class="dlg-q">Remove from wish list?</div>
      <div class="dlg-desc">Removing this post will also remove it from any collections.</div>
      <button class="dlg-btn danger dlg-unsave-go">Remove</button>
      <button class="dlg-btn dlg-cancel">Cancel</button>` : `
      <div class="dlg-q">Unsave post?</div>
      <div class="dlg-desc">Unsaving this post will also remove it from any collections.</div>
      <button class="dlg-btn danger dlg-unsave-go">Unsave</button>
      <button class="dlg-btn dlg-cancel">Cancel</button>`);
    return;
  }
  const unsaveGo = e.target.closest(".dlg-unsave-go");
  if (unsaveGo) {
    const scr = unsaveGo.closest(".screen");
    const V = colState(scr);
    const wl = isWl(scr);
    const first = POSTS.find(x => V.sel.has(x.id));
    V.sel.forEach(pid => {
      const p = POSTS.find(x => x.id === pid);
      if (!p) return;
      if (wl) { p.wishlisted = false; p.wlCol = null; p.wlAt = 0; p.wlColAt = 0; syncWlBtns(scr, p); }
      else { p.saved = false; p.savedCol = null; p.savedAt = 0; syncSaveBtns(scr, p); }
    });
    V.sel.clear(); V.manage = false;
    scr.classList.remove("dialog-open");
    renderSub(scr);
    scrToast(scr, wl ? "Removed from Wish List" : "Removed from All posts", first ? thumbS(first) : "");
    return;
  }
  const rmColGo = e.target.closest(".dlg-rmcol-go");
  if (rmColGo) {
    const scr = rmColGo.closest(".screen");
    const V = colState(scr);
    const wl = isWl(scr);
    const first = POSTS.find(x => V.sel.has(x.id));
    const col = V.col;
    V.sel.forEach(pid => { const p = POSTS.find(x => x.id === pid); if (p) p[wl ? "wlCol" : "savedCol"] = wl ? "Wishlist" : "Saved"; });
    V.sel.clear(); V.manage = false;
    scr.classList.remove("dialog-open");
    renderSub(scr);
    scrToast(scr, `Removed from ${col}`, first ? thumbS(first) : "");
    return;
  }
  /* new collection sheet — Cancel / Next / clear-X */
  const ncCancel = e.target.closest(".nc-cancel");
  if (ncCancel) {
    const scr = ncCancel.closest(".screen");
    if (scr._ncFrom === "save") {
      const post = POSTS.find(x => x.id === scr.dataset.svPid);
      if (post) openSheet(scr, "sv", "save-open", saveSheetHTML(post));
      else scr.classList.remove("save-open");
    } else if (scr._ncFrom === "wishlist") {
      const post = POSTS.find(x => x.id === scr.dataset.wlPid);
      if (post) openSheet(scr, "wl", "save-open", wlSheetHTML(post));
      else scr.classList.remove("save-open");
    } else {
      scr.classList.remove("save-open");
    }
    scr._ncFrom = null; scr._ncPids = null; scr._ncEdit = null;
    return;
  }
  const ncX = e.target.closest(".nc-x");
  if (ncX) {
    const inp = ncX.closest(".nc-field").querySelector(".nc-input");
    inp.value = "";
    inp.dispatchEvent(new Event("input", { bubbles: true }));
    inp.focus({ preventScroll: true });
    return;
  }
  const ncNext = e.target.closest(".nc-next");
  if (ncNext && !ncNext.disabled) {
    const scr = ncNext.closest(".screen");
    const name = (scr.querySelector(".nc-input").value || "").trim() || "New collection";
    const from = scr._ncFrom;
    if (from === "wishlist" || from === "wlmove" || from === "wlcol") WISHLISTS.push({ name, thumb: "" });
    else if (from !== "edit") COLLECTIONS.push({ name, thumb: "" });
    if (from === "save") {
      const post = POSTS.find(x => x.id === scr.dataset.svPid);
      if (post) { post.savedCol = name; post.colAt = Date.now(); }
      scrToast(scr, `Saved to ${name}`);
    } else if (from === "wishlist") {
      const post = POSTS.find(x => x.id === scr.dataset.wlPid);
      if (post) { post.wishlisted = true; post.wlCol = name; post.wlAt = Date.now(); post.wlColAt = post.wlAt; syncWlBtns(scr, post); }
      scrToast(scr, `Added to ${name}`);
    } else if (from === "move" || from === "wlmove") {
      const V = colState(scr);
      const mvFirst = POSTS.find(x => (scr._ncPids || []).includes(x.id));
      const ncWl = from === "wlmove";
      const ncInCol = (scr._subStack || []).at(-1) === "savedcol" || (ncWl && inWlCol(scr));
      (scr._ncPids || []).forEach(pid => { const p = POSTS.find(x => x.id === pid); if (p) { p[ncWl ? "wlCol" : "savedCol"] = name; p[ncWl ? "wlColAt" : "colAt"] = Date.now(); } });
      V.sel.clear(); V.manage = false;
      scrToast(scr, ncInCol ? `Moved to ${name}` : `Added to ${name}`, mvFirst ? thumbS(mvFirst) : "");
    } else if (from === "edit") {
      const old = scr._ncEdit;
      const cur = COLLECTIONS.find(c => c.name === old);
      if (cur) { cur.name = name; }
      POSTS.forEach(p => { if (p.savedCol === old) p.savedCol = name; });
      const V = savedState(scr);
      if (V.col === old) V.col = name;
      scrToast(scr, "Collection updated");
    } else {
      scrToast(scr, "Collection created");
    }
    scr._ncFrom = null; scr._ncPids = null; scr._ncEdit = null;
    scr.classList.remove("save-open");
    if ((scr._subStack || []).length) renderSub(scr);
    return;
  }
  const wlBtn = e.target.closest(".wl-btn");
  if (wlBtn) {
    const scr = wlBtn.closest(".screen");
    const art = wlBtn.closest(".post");
    const pid = art ? art.dataset.pid : scr.dataset.detailPid;
    const post = POSTS.find(x => x.id === pid);
    if (!post) return;
    if (!post.wishlisted) {
      post.wishlisted = true;
      post.wlCol = "Wishlist";
      post.wlAt = Date.now();
      syncWlBtns(scr, post);
    }
    scr.dataset.wlPid = post.id;
    openSheet(scr, "wl", "save-open", wlSheetHTML(post));
    return;
  }
  const wlPick = e.target.closest(".wl-pick");
  if (wlPick) {
    const scr = wlPick.closest(".screen");
    const post = POSTS.find(x => x.id === scr.dataset.wlPid);
    const col = wlPick.dataset.col;
    if (post && col === "Wishlist" && post.wishlisted) {
      post.wishlisted = false; post.wlCol = null; post.wlAt = 0; post.wlColAt = 0;
      syncWlBtns(scr, post);
      scrToast(scr, "Removed from your wish list");
    } else if (post && post.wlCol === col) {
      post.wlCol = "Wishlist";
      scrToast(scr, `Removed from ${col}`);
    } else if (post) {
      post.wlCol = col;
      post.wlColAt = Date.now();
      scrToast(scr, col === "Wishlist" ? "Added to Wish List" : `Added to ${col}`);
    }
    scr.classList.remove("save-open");
    return;
  }
  const wlNew = e.target.closest(".wl-new");
  if (wlNew) {
    const scr = wlNew.closest(".screen");
    scr._ncFrom = "wishlist";
    openSheet(scr, "nc", "save-open", ncSheetHTML());
    scr.querySelector(".nc-input").focus({ preventScroll: true });
    return;
  }
  const wlColEl = e.target.closest(".wl-col, .wl-colbig");
  if (wlColEl) {
    const scr = wlColEl.closest(".screen");
    const V = wlState(scr);
    V.col = wlColEl.dataset.col; V.mode = ""; V.manage = false; V.sel.clear(); V.q = "";
    pushSub(scr, "wishcol");
    return;
  }
  const svBtn = e.target.closest(".save-btn");
  if (svBtn) {
    const scr = svBtn.closest(".screen");
    const art = svBtn.closest(".post");
    const pid = art ? art.dataset.pid : scr.dataset.detailPid;
    const post = findPost(pid);
    if (!post) return;
    if (!post.saved) {
      post.saved = true;
      post.savedCol = "Saved";
      post.savedAt = Date.now();
      syncSaveBtns(scr, post);
    }
    scr.dataset.svPid = post.id;
    openSheet(scr, "sv", "save-open", saveSheetHTML(post));
    return;
  }
  const svPick = e.target.closest(".sv-pick");
  if (svPick) {
    const scr = svPick.closest(".screen");
    const post = POSTS.find(x => x.id === scr.dataset.svPid);
    const col = svPick.dataset.col;
    if (post && col === "Saved" && post.saved) {
      post.saved = false; post.savedCol = null; post.savedAt = 0;
      syncSaveBtns(scr, post);
      scrToast(scr, "Removed from your saved");
    } else if (post && post.savedCol === col) {
      post.savedCol = "Saved";
      scrToast(scr, `Removed from ${col}`);
    } else if (post) {
      post.savedCol = col;
      if (col !== "Saved") post.colAt = Date.now();
      scrToast(scr, col === "Saved" ? "Saved" : `Saved to ${col}`);
    }
    scr.classList.remove("save-open");
    return;
  }
  const svNew = e.target.closest(".sv-new");
  if (svNew) {
    const scr = svNew.closest(".screen");
    scr._ncFrom = "save";
    openSheet(scr, "nc", "save-open", ncSheetHTML());
    scr.querySelector(".nc-input").focus({ preventScroll: true });
    return;
  }
  const closeSheet = e.target.closest(".sheet-backdrop, .sheet-handle");
  if (closeSheet) {
    closeSheet.closest(".screen").classList.remove("comments-open", "unfollow-open", "pm-open", "mf-open", "dialog-open", "likes-open", "share-open", "save-open", "sort-open", "details-open", "wa-open");
    return;
  }
  const clike = e.target.closest(".c-like");
  if (clike) {
    clike.classList.toggle("liked");
    const n = clike.querySelector("span");
    if (n.textContent !== "") n.textContent = parseInt(n.textContent) + (clike.classList.contains("liked") ? 1 : -1);
    else if (clike.classList.contains("liked")) n.textContent = "1";
    return;
  }
  const ft = e.target.closest(".feed-tab");
  if (ft) {
    setFeedTab(ft.closest(".screen"), ft.dataset.tab);
    return;
  }
  const ph = e.target.closest(".post-photo, .detail-hero");
  if (ph) {
    if (suppressPhotoClick || e.target.closest("button")) return;
    const { post, dotsEl } = photoCtx(ph);
    if (post && post.photos.length > 1) {
      let i = +(ph.dataset.i || 0);
      const rect = ph.getBoundingClientRect();
      i = (e.clientX - rect.left > rect.width / 2)
        ? (i + 1) % post.photos.length
        : (i - 1 + post.photos.length) % post.photos.length;
      applyPhoto(ph, post, i, dotsEl);
    }
    return;
  }
  const t = e.target.closest(".details-toggle");
  if (t) {
    if (t.classList.contains("pv-dt")) {
      const scr = t.closest(".screen");
      const post = POSTS.find(x => x.id === t.closest(".post").dataset.pid);
      if (post) { scr.dataset.dtPid = post.id; openSheet(scr, "dt", "details-open", pvDetailsSheetHTML(post)); }
      return;
    }
    t.classList.toggle("open");
    t.nextElementSibling.classList.toggle("open");
    const lbl = t.querySelector(".dt-label");
    if (lbl) lbl.textContent = t.classList.contains("open") ? "Hide details" : "Tap for details";
    if (t.classList.contains("open"))
      t.closest(".screen").querySelectorAll(".details-toggle.open").forEach(o => {
        if (o === t) return;
        o.classList.remove("open");
        o.nextElementSibling.classList.remove("open");
        const ol = o.querySelector(".dt-label");
        if (ol) ol.textContent = "Tap for details";
      });
    return;
  }
  const igdTag = e.target.closest(".igd-tag");
  if (igdTag) {
    const scr = igdTag.closest(".screen");
    const S = srchState(scr);
    S.q = igdTag.textContent.trim();
    S.mode = "results"; S.tab = "foryou";
    openSub(scr, "search");
    return;
  }
  const more = e.target.closest(".more-link");
  if (more) {
    const pvPost = more.closest(".pv-post");
    if (pvPost) {
      const scr = more.closest(".screen");
      const post = POSTS.find(x => x.id === pvPost.dataset.pid);
      if (post) { scr.dataset.dtPid = post.id; openSheet(scr, "ps", "comments-open", pvPostSheetHTML(post)); }
      return;
    }
    more.closest(".caption").classList.add("expanded");
    return;
  }
  const capExp = e.target.closest(".caption.expanded");
  if (capExp && !capExp.closest(".pv-post")) {
    capExp.classList.remove("expanded");
    const tgl = capExp.closest(".post")?.querySelector(".details-toggle.open");
    if (tgl) {
      tgl.classList.remove("open");
      tgl.nextElementSibling.classList.remove("open");
      const lbl = tgl.querySelector(".dt-label");
      if (lbl) lbl.textContent = "Tap for details";
    }
    return;
  }
  const like = e.target.closest(".like-btn");
  if (like) {
    const scr = like.closest(".screen");
    const art = like.closest(".post");
    const pid = art ? art.dataset.pid : scr.dataset.detailPid;
    const post = findPost(pid);
    if (!post) return;
    post.liked = !post.liked;
    post.likes += post.liked ? 1 : -1;
    scr.querySelectorAll(".like-btn").forEach(b => {
      const bArt = b.closest(".post");
      if ((bArt ? bArt.dataset.pid : scr.dataset.detailPid) === pid) {
        b.classList.toggle("liked", post.liked);
        const ln = b.querySelector(".lk-n");
        if (ln) ln.textContent = post.likes || "";
      }
    });
  }
});

render();
</script>
</body>
</html>
