l<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TukDaeng — FO Prototype</title>
<style>
  @font-face {
    font-family: "IBM Plex Sans Thai";
    font-weight: 400;
    src: url("./assets/fonts/google/IBMPlexSansThai-Regular.ttf") format("truetype");
  }
  @font-face {
    font-family: "IBM Plex Sans Thai";
    font-weight: 500;
    src: url("./assets/fonts/google/IBMPlexSansThai-Medium.ttf") format("truetype");
  }
  @font-face {
    font-family: "IBM Plex Sans Thai";
    font-weight: 600;
    src: url("./assets/fonts/google/IBMPlexSansThai-SemiBold.ttf") format("truetype");
  }
  @font-face {
    font-family: "Bebas Neue";
    src: url("./assets/fonts/google/BebasNeue-Regular.ttf") format("truetype");
  }

  :root {
    --red: #c8212b;
    --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "IBM Plex Sans Thai", Arial, sans-serif;
    --font-brand: var(--font-main);
    --page-bg: #1a1a1e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-main);
    background: var(--page-bg);
    color: #e8e8ec;
    min-height: 100vh;
    display: flex;
    flex-direction: row;
  }

  /* ============ REVIEW SIDEBAR ============ */
  .review-bar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: 250px;
    z-index: 50;
    background: #111114;
    border-right: 1px solid #2a2a30;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
  }
  .review-bar .title {
    font-family: var(--font-brand);
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: var(--red);
  }
  .review-bar .sub {
    font-size: 12px;
    color: #8b8b95;
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .variant-btn {
    font-family: var(--font-main);
    font-size: 13px;
    text-align: left;
    padding: 9px 14px;
    border-radius: 10px;
    border: 1px solid #3a3a42;
    background: transparent;
    color: #c8c8d0;
    cursor: pointer;
    transition: all .15s ease;
  }
  .variant-btn:hover { border-color: #6b6b76; color: #fff; }
  .variant-btn.active {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
    font-weight: 600;
  }
  .variant-label {
    font-size: 12px;
    color: #8b8b95;
    line-height: 1.5;
    margin-top: 8px;
    padding-top: 12px;
    border-top: 1px solid #2a2a30;
  }
  .grp-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #6b6b76;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid #2a2a30;
  }

  /* ============ PHONE PAIR ============ */
  .stage {
    display: flex;
    gap: 48px;
    padding: 40px 24px 64px;
    margin-left: 250px;
    flex: 1;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
  }
  .phone-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .theme-tag {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #8b8b95;
  }
  .phone {
    width: 390px;
    height: 844px;
    border-radius: 44px;
    padding: 10px;
    background: #000;
    box-shadow: 0 24px 64px rgba(0,0,0,.55), inset 0 0 0 2px #2e2e33;
    position: relative;
    flex-shrink: 0;
  }
  .screen {
    width: 100%;
    height: 100%;
    border-radius: 34px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* theme tokens on each screen */
  .screen[data-theme="dark"] {
    --bg: #0b0b0d;
    --surface: #16161a;
    --surface-2: #1e1e24;
    --line: #26262c;
    --text: #f2f2f5;
    --muted: #9a9aa3;
    --chip-bg: rgba(255,255,255,.08);
    --chip-text: #d6d6dc;
    --btn-gray: #2b2b31;
    --link: #79b5f2;
    background: var(--bg);
    color: var(--text);
  }
  .screen[data-theme="light"] {
    --bg: #f6f6f8;
    --surface: #ffffff;
    --surface-2: #f0f0f3;
    --line: #e4e4e9;
    --text: #141417;
    --muted: #6d6d78;
    --chip-bg: rgba(0,0,0,.06);
    --chip-text: #3a3a42;
    --btn-gray: #ededf0;
    --link: #0b57d0;
    background: var(--bg);
    color: var(--text);
  }

  /* ============ STATUS BAR ============ */
  .statusbar {
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .statusbar .icons { display: flex; gap: 5px; align-items: center; opacity: .8; }
  .statusbar svg { display: block; }

  /* ============ APP HEADER ============ */
  .app-header {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px 8px;
    flex-shrink: 0;
    position: relative;
  }
  .app-header .wordmark {
    font-family: var(--font-main);
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: var(--red);
    line-height: 1;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: default;
  }
  .wordmark .caret { display: none; color: var(--text); opacity: .85; }
  .screen[data-ft="none"] .wordmark { cursor: pointer; }
  .screen[data-ft="none"] .wordmark .caret { display: inline-flex; }

  /* brand feed dropdown (F4 — pure IG) */
  .brand-menu {
    position: absolute;
    top: 78px;
    left: 50%;
    transform: translateX(-50%) translateY(-6px);
    width: 180px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 6px;
    z-index: 70;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .screen.brand-open .brand-menu { opacity: 1; pointer-events: auto; transform: translateX(-50%); }
  .brand-menu button {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border: none;
    background: none;
    color: var(--text);
    font-family: var(--font-main);
    font-size: 13.5px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
  }
  .brand-menu button:hover { background: var(--chip-bg); }
  .brand-menu .check { opacity: 0; }
  .brand-menu button.on .check { opacity: 1; }
  .app-header .spacer { margin-left: auto; }
  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--chip-bg); }
  .icon-btn svg { display: block; }

  /* ============ HAMBURGER DRAWER (NAV-001 — IG settings-style side menu) ============ */
  .hb-wrap { position: absolute; inset: 0; z-index: 80; pointer-events: none; }
  .screen.hb-open .hb-wrap { pointer-events: auto; }
  .hb-scrim {
    position: absolute; left: 0; right: 0; top: 34px; bottom: 0;
    background: rgba(0,0,0,.3);
    opacity: 0; transition: opacity .26s ease;
  }
  .screen.hb-open .hb-scrim { opacity: 1; }
  .hb-panel {
    position: absolute; left: 0; top: 34px; bottom: 0;
    width: 82%;
    background: var(--bg);
    border-right: 1px solid var(--line);
    transform: translateX(-103%);
    transition: transform .28s ease;
    display: flex; flex-direction: column;
  }
  .screen.hb-open .hb-panel { transform: none; }
  .hb-list { flex: 1; padding: 28px 0 12px; overflow-y: auto; scrollbar-width: none; }
  .hb-list::-webkit-scrollbar { display: none; }
  .hb-item {
    display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 12px 22px;
    background: none; border: none; cursor: pointer;
    font-family: var(--font-main); font-size: 14px; font-weight: 400;
    color: var(--text); text-align: left;
  }
  .hb-item:hover { background: var(--chip-bg); }
  .hb-item svg { display: block; flex-shrink: 0; }
  .hb-item .hb-chev { margin-left: auto; color: var(--muted); display: flex; }

  /* ============ FEED TABS ============ */
  .feed-tabs {
    display: flex;
    gap: 24px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .feed-tab {
    font-family: var(--font-main);
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    background: none;
    border: none;
    padding: 8px 2px 10px;
    cursor: pointer;
    position: relative;
  }
  .feed-tab.active { color: var(--text); }
  .feed-tab.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: var(--red);
    border-radius: 2px 2px 0 0;
  }

  /* FT1c — text centered */
  .screen[data-ft="textc"] .feed-tabs { justify-content: center; gap: 32px; }
  /* FT2c — chips centered */
  .screen[data-ft="chipsc"] .feed-tabs { justify-content: center; }

  /* FT2 — chips */
  .screen[data-ft="chips"] .feed-tabs,
  .screen[data-ft="chipsc"] .feed-tabs { gap: 8px; padding: 8px 12px; border-bottom: none; }
  .screen[data-ft="chips"] .feed-tab,
  .screen[data-ft="chipsc"] .feed-tab {
    padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--chip-bg); color: var(--chip-text);
    font-size: 12.5px;
  }
  .screen[data-ft="chips"] .feed-tab.active,
  .screen[data-ft="chipsc"] .feed-tab.active { background: var(--red); color: #fff; border-color: var(--red); }
  .screen[data-ft="chips"] .feed-tab.active::after,
  .screen[data-ft="chipsc"] .feed-tab.active::after { display: none; }

  /* FT3 — segmented */
  .screen[data-ft="segment"] .feed-tabs {
    gap: 0; margin: 4px 12px 6px; padding: 3px;
    border: none; background: var(--chip-bg); border-radius: 999px;
  }
  .screen[data-ft="segment"] .feed-tab { flex: 1; padding: 7px 0; border-radius: 999px; font-size: 12.5px; text-align: center; }
  .screen[data-ft="segment"] .feed-tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.18); }
  .screen[data-ft="segment"] .feed-tab.active::after { display: none; }

  /* FT4 — none (pure IG) */
  .screen[data-ft="none"] .feed-tabs { display: none; }

  /* ============ FEED SCROLL ============ */
  .feed-scroll {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .feed-scroll::-webkit-scrollbar { display: none; }

  .feed-empty {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 40px 36px;
    text-align: center;
    color: var(--muted);
  }
  .feed-empty .fe-ico { opacity: .45; }
  .feed-empty .fe-title { font-size: 15px; font-weight: 600; color: var(--text); }

  /* ============ POST ============ */
  .post { margin-bottom: 10px; }
  .post-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px 10px 16px;
  }
  /* PROFILE-003 — no red ring on avatars anywhere (IG parity): keep the class
     for click targeting (.post-head .avatar-ring opens profile) but render plain */
  .avatar-ring {
    width: 38px; height: 38px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .avatar-ring img {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }
  .post-head .who { flex: 1; min-width: 0; }
  .post-head .name {
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.3;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .post-head .sub-line {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.3;
  }
  .follow-btn {
    font-family: var(--font-main);
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    background: var(--btn-gray);
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 7px 16px;
    cursor: pointer;
  }
  .follow-btn.on {
    background: transparent;
    border-color: var(--line);
    color: var(--muted);
  }
  .post-head .more {
    color: var(--muted);
    background: none; border: none; cursor: pointer;
    padding: 4px;
    display: flex;
  }

  /* photo */
  .post-photo {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    overflow: hidden;
    background: #000;
  }
  .post-photo img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-counter {
    position: absolute;
    top: 12px; right: 12px;
    background: rgba(20,20,24,.72);
    backdrop-filter: blur(6px);
    color: #fff;
    font-size: 11.5px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .photo-dots {
    display: flex;
    justify-content: center;
    gap: 5px;
    padding: 9px 0 2px;
  }
  .photo-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--line);
  }
  .photo-dots span.on { background: var(--red); }
  .type-tag {
    position: absolute;
    top: 12px; left: 12px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
  }
  .type-tag.sale { background: rgba(200,33,43,.85); color: #fff; }
  .type-tag.showcase { background: rgba(20,20,24,.6); color: rgba(255,255,255,.85); }
  .price-overlay {
    position: absolute;
    bottom: 12px; left: 12px;
    background: rgba(15,15,18,.62);
    backdrop-filter: blur(8px);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 999px;
  }
  .cond-overlay {
    position: absolute;
    top: 12px; left: 12px;
    background: rgba(15,15,18,.62);
    backdrop-filter: blur(8px);
    color: rgba(255,255,255,.9);
    font-size: 11px;
    font-weight: 500;
    padding: 5px 11px;
    border-radius: 999px;
  }

  /* action row */
  .post-actions {
    display: flex;
    align-items: center;
    padding: 8px 11px 2px 9px;
    gap: 2px;
  }
  .act {
    display: flex;
    align-items: center;
    gap: 5px;
    background: none; border: none;
    color: var(--text);
    font-family: var(--font-main);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    padding: 5px 7px;
    border-radius: 8px;
  }
  .act:hover { background: var(--chip-bg); }
  .act svg { display: block; }
  .act.liked svg path { fill: var(--red); stroke: var(--red); }
  .act-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .ask-pill {
    font-family: var(--font-main);
    font-size: 12.5px;
    font-weight: 600;
    border-radius: 999px;
    padding: 6px 15px;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .ask-pill.outline {
    background: none;
    border: 1.2px solid var(--muted);
    color: var(--text);
  }
  .ask-pill.solid {
    background: var(--red);
    border: none;
    color: #fff;
  }
  .ask-pill.txt {
    background: none;
    border: none;
    color: var(--red);
    padding: 6px 8px;
  }
  .ask-pill.ico {
    background: none;
    border: none;
    color: var(--text);
    padding: 6px;
    border-radius: 50%;
  }
  .ask-pill.ico svg { width: 21px; height: 21px; }
  .save-btn {
    background: none; border: none;
    color: var(--text);
    padding: 5px;
    cursor: pointer;
    display: flex;
  }
  .mf-btn, .wl-btn {
    display: flex;
    align-items: center;
    background: none; border: none;
    color: var(--text);
    cursor: pointer;
    padding: 5px 7px;
    border-radius: 8px;
  }
  .mf-btn:hover, .wl-btn:hover { background: var(--chip-bg); }
  .mf-btn svg, .wl-btn svg { display: block; }
  .mf-btn.on svg path { fill: var(--text); }
  .wl-ic { display: flex; }
  .wl-f { display: none; }
  .wl-btn.saved .wl-o { display: none; }
  .wl-btn.saved .wl-f { display: flex; }

  /* liked-by / caption / details */
  .liked-by {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 16px 0;
    font-size: 12.5px;
    color: var(--text);
  }
  .liked-by .stack { display: flex; }
  .liked-by img {
    width: 18px; height: 18px;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid var(--bg);
  }
  .liked-by .stack img + img { margin-left: -6px; }
  .liked-by b { font-weight: 600; }
  .comment-preview {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 16px 0;
    font-size: 13px;
    color: var(--text);
  }
  .comment-preview .txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .comment-preview b { font-weight: 600; }
  .comment-preview svg { color: var(--muted); flex-shrink: 0; }
  .post-time {
    padding: 4px 16px 0;
    font-size: 12px;
    color: var(--muted);
  }
  .caption {
    padding: 4px 16px 0;
    font-size: 13.5px;
    line-height: 1.5;
  }
  .caption b { font-weight: 600; }
  .caption .more-link { color: var(--muted); cursor: pointer; }
  .caption .cap-full { display: none; }
  .caption.expanded { cursor: pointer; }
  .caption.expanded .cap-short { display: none; }
  .caption.expanded .cap-full { display: inline; }
  /* feed posts keep the "Tap for details" trigger hidden until the caption is expanded via "more" */
  .post:not(.pv-post) .caption:not(.expanded) ~ .details-toggle { display: none; }
  .quiet-price {
    padding: 3px 16px 0;
    font-size: 13px;
    color: var(--muted);
  }
  .details-toggle {
    margin: 8px 16px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 9px 13px;
    font-family: var(--font-main);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    width: calc(100% - 32px);
  }
  .details-toggle svg { transition: transform .2s ease; color: var(--muted); }
  .details-toggle.open svg { transform: rotate(180deg); }
  .details-body {
    margin: 0 16px;
    max-height: 0;
    overflow: hidden;
    transition: max-height .3s ease, margin-top .25s ease;
  }
  .details-body.open { max-height: 2000px; margin-top: 8px; }
  .details-inner {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 13px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .details-price {
    font-size: 15px;
    font-weight: 600;
    color: var(--red);
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--chip-text);
    background: var(--chip-bg);
    border-radius: 999px;
    padding: 4px 10px;
  }

  /* trigger styles */
  .details-toggle.ln,
  .details-toggle.txt {
    background: none;
    border: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
  }
  .details-toggle.ln i,
  .details-toggle.txt i {
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .details-toggle.ln .knob {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    flex-shrink: 0;
  }
  .details-toggle.txt {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .03em;
  }
  .details-toggle.txt svg { color: var(--muted); }

  /* D1 spec tiles grid */
  .spec-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }
  .spec-tile {
    background: var(--chip-bg);
    border-radius: 11px;
    padding: 8px 11px;
  }
  .spec-tile .l {
    font-size: 10.5px;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .spec-tile .v {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
  }
  /* D2 list rows */
  .spec-rows { display: flex; flex-direction: column; }
  .spec-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 7px 2px;
    font-size: 13px;
  }
  .spec-row + .spec-row { border-top: 1px solid var(--line); }
  .spec-row .l { color: var(--muted); }
  .spec-row .v { font-weight: 600; text-align: right; }

  /* B3 price footer */
  .price-footer {
    margin: 10px 14px 12px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .price-footer .p {
    font-size: 15px;
    font-weight: 600;
    color: var(--red);
  }

  /* ============ CARD (B + C variants) ============ */
  .screen[data-variant^="b"] .feed-scroll,
  .screen[data-variant^="c"] .feed-scroll { padding: 10px 12px 0; }
  .screen[data-variant^="b"] .post,
  .screen[data-variant^="c"] .post {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .screen[data-variant^="b"] .post-photo {
    margin: 0 10px;
    width: calc(100% - 20px);
    border-radius: 14px;
  }
  .screen[data-variant^="b"] .post-head { padding: 12px 14px 12px 14px; }
  .screen[data-variant^="b"] .liked-by,
  .screen[data-variant^="b"] .caption,
  .screen[data-variant^="b"] .quiet-price,
  .screen[data-variant^="c"] .liked-by,
  .screen[data-variant^="c"] .caption,
  .screen[data-variant^="c"] .quiet-price { padding-left: 14px; padding-right: 14px; }
  .screen[data-variant^="b"] .details-toggle { margin-left: 14px; width: calc(100% - 28px); }
  .screen[data-variant^="b"] .details-body { margin-left: 14px; margin-right: 14px; }
  .screen[data-variant^="b"] .post-actions { padding-left: 7px; padding-right: 9px; }
  .screen[data-variant^="b"] .post > :last-child,
  .screen[data-variant^="c"] .post > :last-child { margin-bottom: 12px; }
  .screen[data-variant^="c"] .post-time { padding-bottom: 10px; }

  /* ============ DETAIL PAGE (Layer 3) ============ */
  .page-detail {
    position: absolute;
    top: 34px;
    bottom: 22px;
    left: 0;
    right: 0;
    background: var(--bg);
    transform: translateX(100%);
    transition: transform .28s ease;
    z-index: 35; /* above .page-pv (34) — viewer stays mounted underneath so detail-back reveals it */
    display: flex;
    flex-direction: column;
  }
  .screen.detail-open .page-detail { transform: none; }
  .detail-head {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 8px 12px;
    flex-shrink: 0;
  }
  .detail-title { font-size: 16px; font-weight: 700; margin-left: 4px; }
  .detail-head .spacer { margin-left: auto; }
  .detail-scroll {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .detail-scroll::-webkit-scrollbar { display: none; }
  .detail-hero {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    background: #000;
    overflow: hidden;
  }
  .detail-hero img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .detail-pad { padding: 0 16px 28px; }
  .page-detail .post-actions { padding-left: 9px; padding-right: 11px; }
  .inline-tag {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .08em;
    padding: 4px 10px;
    border-radius: 6px;
    background: var(--red);
    color: #fff;
    margin: 12px 0 8px;
  }
  .inline-tag.muted { background: var(--chip-bg); color: var(--chip-text); }
  .detail-name { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .detail-ref { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
  .detail-seller {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-top: 1px solid var(--line);
    margin-top: 10px;
  }
  .detail-seller .who { flex: 1; }
  .detail-price {
    font-size: 26px;
    font-weight: 700;
    margin: 16px 0 12px;
    letter-spacing: .01em;
  }
  .cta-row { display: flex; gap: 10px; }
  .cta {
    flex: 1;
    font-family: var(--font-main);
    font-size: 14px;
    font-weight: 600;
    padding: 12px 0;
    border-radius: 10px;
    cursor: pointer;
    border: 1.2px solid var(--line);
    background: none;
    color: var(--text);
  }
  .cta.red { background: var(--red); border-color: var(--red); color: #fff; }
  .detail-h {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 28px 0 10px;
    display: flex;
    align-items: baseline;
  }
  .detail-h .spacer { margin-left: auto; }
  .viewall { font-size: 12.5px; font-weight: 500; color: var(--muted); cursor: pointer; }
  .detail-desc { font-size: 13.5px; line-height: 1.75; color: var(--chip-text); }
  .details-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .view-full {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    flex-shrink: 0;
  }
  .details-inner { cursor: default; }
  .view-full { cursor: pointer; }
  .comment-card { display: flex; gap: 10px; padding: 8px 0; }
  .comment-card img {
    width: 34px; height: 34px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
  }
  .comment-card .cname { font-size: 13px; font-weight: 600; }
  .comment-card .ctime { font-size: 11.5px; color: var(--muted); }
  .comment-card .ctext { font-size: 13px; margin-top: 2px; }
  .comment-card .creply { font-size: 11.5px; color: var(--muted); font-weight: 600; margin-top: 4px; cursor: pointer; }

  /* ============ COMMENT SHEET ============ */
  .sheet-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    z-index: 35;
  }
  .comment-sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 74%;
    background: var(--bg);
    border-radius: 18px 18px 0 0;
    border-top: 1px solid var(--line);
    transform: translateY(103%);
    transition: transform .3s ease;
    z-index: 36;
    display: flex;
    flex-direction: column;
  }
  .screen.comments-open .sheet-backdrop,
  .screen.unfollow-open .sheet-backdrop,
  .screen.mf-open .sheet-backdrop,
  .screen.pm-open .sheet-backdrop { opacity: 1; pointer-events: auto; }
  .screen.comments-open .comment-sheet,
  .screen.unfollow-open .comment-sheet,
  .screen.mf-open .comment-sheet,
  .screen.pm-open .comment-sheet { transform: none; }
  .comment-sheet.uf { height: auto; }
  .uf-body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 10px 24px 30px;
    text-align: center;
  }
  .uf-av { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; }
  .uf-q { font-size: 15px; font-weight: 600; color: var(--text); }
  .uf-confirm, .uf-cancel {
    width: 100%;
    font-family: var(--font-main);
    font-size: 14px;
    font-weight: 600;
    padding: 11px;
    border-radius: 10px;
    cursor: pointer;
  }
  .uf-confirm { border: none; background: var(--red); color: #fff; }
  .uf-cancel { border: 1px solid var(--line); background: transparent; color: var(--text); }

  /* ============ POST MENU SHEET (FEED-009 — IG-style "..." flow) ============ */
  .comment-sheet.pm { height: auto; }
  .pm-card {
    margin: 16px 10px 30px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .pm-card.pm-top {
    margin-bottom: 0;
  }
  .pm-card.pm-top + .pm-card {
    margin-top: 10px;
  }
  .pm-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: var(--font-main);
    font-size: 14.5px;
    font-weight: 400;
    color: var(--text);
    background: none; border: none;
    padding: 15px 16px;
    cursor: pointer;
    text-align: left;
  }
  .pm-row svg { flex-shrink: 0; }
  .pm-row + .pm-row { border-top: 1px solid var(--line); }
  .pm-row.danger { color: var(--red); }
  .pm-row.pm-ctr { justify-content: center; } /* IG action-sheet parity — centered plain rows */
  .comment-sheet.pm .pm-card.pm-rows { margin-bottom: 8px; }
  .comment-sheet.pm .pm-card.pm-cancel { margin-top: 0; margin-bottom: 22px; }
  /* ============ PROFILE-005 — IG block confirm sheet / About this account / restrict hint ============ */
  .blk-body {
    display: flex; flex-direction: column; align-items: stretch;
    padding: 28px 23px 40px; text-align: left;
  }
  .blk-av { width: 89px; height: 89px; border-radius: 50%; object-fit: cover; align-self: center; }
  .blk-q { font-size: 21px; font-weight: 700; color: var(--text); margin-top: 14px; padding: 0 7px; }
  .blk-d { font-size: 14px; color: var(--text); line-height: 1.4; margin: 12px 0 24px; padding: 0 7px; }
  .blk-i {
    display: flex; gap: 14px; align-items: flex-start; text-align: left;
    font-size: 14px; color: var(--text); line-height: 1.4; width: 100%; margin-bottom: 22px; padding: 0 7px;
  }
  .blk-i svg { flex-shrink: 0; margin-top: 4px; }
  .blk-go, .blk-rep {
    width: 100%; border: none; border-radius: 11px; height: 41px; margin-top: 0;
    background: var(--red); color: #fff; font-family: var(--font-main);
    font-size: 14.5px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .blk-go { margin-top: 30px; }
  .blk-rep { margin-top: 11px; background: var(--surface-2); color: var(--text); }
  /* about page */
  .ab-hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 20px 26px 6px; }
  .ab-av { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; }
  .ab-name { display: flex; align-items: center; gap: 5px; margin-top: 12px; font-size: 16px; font-weight: 700; color: var(--text); }
  .ab-name .ab-vb { display: flex; }
  .ab-note { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 9px; }
  .ab-note b { color: var(--text); font-weight: 500; }
  .ab-row { display: flex; align-items: flex-start; gap: 14px; padding: 12px 22px; }
  .ab-row .ab-ic { color: var(--text); flex-shrink: 0; margin-top: 2px; }
  .ab-b { display: flex; flex-direction: column; gap: 1px; text-align: left; min-width: 0; }
  .ab-t { font-size: 15px; font-weight: 500; color: var(--text); }
  .ab-v { font-size: 14px; color: var(--muted); }
  .ab-foot { font-size: 13px; color: var(--muted); line-height: 1.5; padding: 14px 22px; }
  /* post-unblock restrict hint banner (IG) */
  .pf-rhint {
    position: absolute; left: 10px; right: 10px; bottom: 62px; z-index: 45;
    display: flex; align-items: center; gap: 10px;
    background: #26262c; color: #f2f2f5; border: 1px solid #3f3f48;
    border-radius: 12px; padding: 12px 14px; font-size: 12.5px; line-height: 1.4;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); cursor: pointer;
  }
  .pf-rhint svg { flex-shrink: 0; }
  .pf-rhint .pf-rhint-lm { margin-left: auto; flex-shrink: 0; font-weight: 700; color: var(--red); padding-left: 8px; }
  /* ============ FOLLOWING manage sheet (PROFILE-003 — IG "Following ⌄" flow) ============ */
  .comment-sheet.mf { height: auto; }
  .screen.mf-open .sheet-backdrop { opacity: 1; pointer-events: auto; }
  .screen.mf-open .comment-sheet { transform: none; }
  .comment-sheet.mf .sheet-title { font-size: 16px; } /* IG: username head is a touch bigger */
  .mf-list { padding-bottom: 38px; } /* IG parity — roomy gap under the last row */
  .mf-row {
    width: 100%; display: flex; align-items: center; gap: 14px;
    font-family: var(--font-main); font-size: 15px; font-weight: 400; color: var(--text);
    background: none; border: none; padding: 15px 18px; cursor: pointer; text-align: left;
  }
  .mf-row > svg, .mf-row > .tg-sw { margin-left: auto; flex-shrink: 0; }
  .mf-row > svg { color: var(--muted); }
  .mf-row + .mf-row { border-top: 1px solid var(--line); }

  .pm-undo {
    font-family: var(--font-main);
    font-size: 14px; font-weight: 600;
    color: var(--red);
    background: none; border: none;
    padding: 4px;
    cursor: pointer;
  }
  /* not-interested card — replaces the post inline in the feed (IG-style) */
  .ni-box {
    margin: 0 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .ni-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 4px;
  }
  .ni-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .ni-sub { font-size: 13px; color: var(--muted); padding: 0 16px 14px; }
  .ni-item {
    width: 100%;
    display: flex; align-items: center; gap: 14px;
    font-family: var(--font-main);
    font-size: 14px;
    color: var(--text);
    background: none; border: none;
    border-top: 1px solid var(--line);
    padding: 15px 16px;
    cursor: pointer;
    text-align: left;
  }
  .ni-item svg { flex-shrink: 0; }
  .ni-item .ni-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .ni-desc { font-size: 12px; color: var(--muted); }

  /* ============ FEED-010 — mute dialog / settings+content-prefs page / uncomfortable sheet ============ */
  /* in-screen pill toast, centered over content (IG "Posts muted"/"Unfollowed" style) */
  .sc-toast {
    position: absolute; left: 50%; top: 44%;
    transform: translate(-50%,-50%) scale(.94);
    display: flex; align-items: center; gap: 9px;
    background: #26262c; color: #f2f2f5; border: 1px solid #3f3f48;
    font-size: 13px; font-weight: 500; padding: 9px 18px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: all .22s ease;
    z-index: 60; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .sc-toast.st-top { top: 68px; border-radius: 16px; padding: 9px 20px 9px 10px; }
  .sc-toast .st-img { width: 26px; height: 26px; border-radius: 7px; object-fit: cover; }
  .sc-toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  /* center confirm dialog (IG "Mute x?" style) */
  .dlg {
    position: absolute; left: 50%; top: 50%;
    width: min(320px, calc(100% - 64px));
    transform: translate(-50%,-50%) scale(.95);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; opacity: 0; pointer-events: none;
    transition: all .2s ease; z-index: 40; overflow: hidden; text-align: center;
  }
  .screen.dialog-open .sheet-backdrop { opacity: 1; pointer-events: auto; }
  .screen.dialog-open .dlg { opacity: 1; pointer-events: auto; transform: translate(-50%,-50%) scale(1); }
  .dlg-q { font-size: 15.5px; font-weight: 700; padding: 20px 20px 6px; }
  .dlg-desc { font-size: 13px; color: var(--muted); line-height: 1.45; padding: 0 20px 16px; }
  .dlg-btn {
    width: 100%; font-family: var(--font-main); font-size: 14px; font-weight: 600;
    padding: 13px; background: none; border: none; border-top: 1px solid var(--line);
    color: var(--text); cursor: pointer;
  }
  .dlg-btn.danger { color: var(--red); }

  /* ============ FEED-011 — like / share / save action row ============ */
  /* eye + view count: display only, not a button */
  .views-stat {
    display: flex; align-items: center; gap: 5px;
    color: var(--text); font-size: 13px; font-weight: 500;
    padding: 5px 7px;
  }
  .views-stat svg { display: block; }
  .save-btn.saved svg path { fill: var(--text); }
  .liked-by { cursor: pointer; user-select: none; }

  .screen.likes-open .sheet-backdrop,
  .screen.share-open .sheet-backdrop,
  .screen.save-open .sheet-backdrop { opacity: 1; pointer-events: auto; }
  .screen.likes-open .comment-sheet,
  .screen.share-open .comment-sheet,
  .screen.save-open .comment-sheet { transform: none; }
  .comment-sheet.lk { height: 64%; }
  .comment-sheet.sh { height: auto; }
  .comment-sheet.sv, .comment-sheet.wl { height: auto; max-height: 72%; }

  /* likes sheet — title + note + people rows (no search, no views tab) */
  .lk-note {
    font-size: 13px; color: var(--muted); line-height: 1.5;
    padding: 0 16px 10px; flex-shrink: 0;
  }
  .lk-row { display: flex; align-items: center; gap: 11px; padding: 7px 0; }
  .lk-row img {
    width: 44px; height: 44px; border-radius: 50%;
    object-fit: cover; flex-shrink: 0;
  }
  .lk-who { flex: 1; min-width: 0; }
  .lk-who .u { font-size: 13.5px; font-weight: 600; color: var(--text); }
  .lk-who .d {
    font-size: 13px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .lk-follow {
    flex-shrink: 0; font-family: var(--font-main); font-size: 13.5px; font-weight: 600;
    border: none; border-radius: 8px; padding: 7px 22px; cursor: pointer;
    background: var(--red); color: #fff;
  }
  .lk-follow.on { background: var(--chip-bg); color: var(--text); }

  /* share sheet — search + friend grid + app row */
  .sh-search {
    display: flex; align-items: center; gap: 10px;
    margin: 4px 16px 12px; flex-shrink: 0;
  }
  .sh-field {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; color: var(--muted);
  }
  .sh-field input {
    flex: 1; min-width: 0; background: none; border: none; outline: none;
    font-family: var(--font-main); font-size: 14px; color: var(--text);
  }
  .sh-add {
    width: 38px; height: 38px; flex-shrink: 0;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--text); cursor: pointer;
  }
  .sh-grid {
    flex: 0 0 auto; height: 216px; overflow-y: auto; scrollbar-width: none;
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 15px 6px; padding: 2px 18px 14px; align-content: start;
  }
  .sh-grid::-webkit-scrollbar { display: none; }
  .sh-fr {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    background: none; border: none; cursor: pointer; font-family: var(--font-main);
    padding: 0;
  }
  .sh-fr img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; }
  .sh-fr .n {
    font-size: 11.5px; color: var(--text); text-align: center; line-height: 1.3;
    max-width: 100px;
    display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .sh-apps {
    display: flex; gap: 4px; flex-shrink: 0;
    border-top: 1px solid var(--line);
    padding: 12px 10px 18px; overflow-x: auto; scrollbar-width: none;
  }
  .sh-apps::-webkit-scrollbar { display: none; }
  .sh-app {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    background: none; border: none; cursor: pointer; min-width: 0; flex: 1;
    font-family: var(--font-main); padding: 0;
  }
  .sh-app .ic {
    width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .02em;
  }
  .sh-app .t { font-size: 11px; color: var(--text); }
  .sh-app.gray .ic {
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
  }

  /* save / collections sheet — "Saved" head + collection rows + new */
  .sv-pick, .wl-pick {
    width: 100%; display: flex; align-items: center; gap: 12px;
    background: none; border: none; font-family: var(--font-main);
    cursor: pointer; text-align: left;
  }
  .sv-head { padding: 8px 16px 12px; }
  .sv-head .thumb, .sv-row .thumb {
    width: 46px; height: 46px; border-radius: 8px; object-fit: cover;
    background: var(--surface-2); border: 1px solid var(--line); flex-shrink: 0;
  }
  .sv-row .thumb.none { display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .sv-head .b, .sv-row .b { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .sv-head .t { font-size: 15px; font-weight: 600; color: var(--text); }
  .sv-head .s, .sv-row .s { font-size: 12.5px; color: var(--muted); }
  .sv-head > svg { color: var(--text); }
  .sv-head.saved > svg path { fill: var(--text); }
  .sv-row .plus.on { background: var(--text); border-color: var(--text); color: var(--bg); }
  .sv-sec {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 16px;
  }
  .sv-sec .l { font-size: 14.5px; font-weight: 700; color: var(--text); }
  .sv-new, .wl-new {
    font-family: var(--font-main); font-size: 13px; font-weight: 500;
    color: var(--red); background: none; border: none; cursor: pointer; padding: 4px 0;

  /* collections tab — big square cards, single cover, name below (IG) */

  /* move-to-collection picker reuses the sv sheet look */

  /* new collection sheet — Cancel / Next + name field */

  /* settings / content-preferences page — slides in like the detail page */
  .page-sub {

/* ================= RENDER ================= */
const state = { variant: "a1", tStyle: "t3", dStyle: "d2", nav: "labeled", ft: "chipsc", ask: "outline", ds: "full", pr: "pr1", dh: "dh1", dl: "dl1", tg: "tg1", feedTab: "all" };

function askBtnHTML(defaultSolid) {
  let style = state.ask === "auto" ? (defaultSolid ? "solid" : "outline") : state.ask;
  if (style === "bubble") style = "outline";
  if (style === "ico") return `<button class="ask-pill ico" title="Ask seller">${I.chat(21)}</button>`;
  if (style === "txt") return `<button class="ask-pill txt">Ask</button>`;
  return `<button class="ask-pill ${style}">${I.chat(14)} Ask</button>`;
}

function triggerHTML() {
  const lbl = `<span class="dt-label">Tap for details</span>`;
  if (state.tStyle === "t2")
    return `<button class="details-toggle ln"><i></i><span class="knob">${I.chev(13)}</span><i></i></button>`;
  if (state.tStyle === "t3")
    return `<button class="details-toggle txt"><i></i>${lbl}${I.chev(13)}<i></i></button>`;
  return `<button class="details-toggle">${lbl}${I.chev()}</button>`;
}

function detailsHTML(p, showPriceRow) {
  const groups = ((p.specGroups && p.specGroups.length) ? p.specGroups : [{ title: "", rows: p.specs }])
    .filter(g => g.title !== "Price & Data Source");
  const renderRows = {
    d1: rows => `<div class="spec-grid">${rows.map(s => `<div class="spec-tile"><div class="l">${s[0]}</div><div class="v">${s[1]}</div></div>`).join("")}</div>`,
    d2: rows => `<div class="spec-rows">${rows.map(s => `<div class="spec-row"><span class="l">${s[0]}</span><span class="v">${s[1]}</span></div>`).join("")}</div>`,
    d3: rows => `<div class="chip-row">${rows.map(s => `<span class="chip"><b>${s[0]}:</b>&nbsp;${s[1]}</span>`).join("")}</div>`,
  }[state.dStyle];
  const content = specGroupsHTML(groups, renderRows, t => `<div class="spec-sec">${t}</div>`);
  return `
    <div class="details-body">
      <div class="details-inner">
        <div class="details-top">
          ${showPriceRow ? `<div class="details-price">${p.price}</div>` : `<span></span>`}
          <span class="view-full">View full detail ${I.chevR()}</span>
        </div>
        ${content}
      </div>
    </div>`;
}

function detailHeadHTML(p) {
  const back = `<button class="icon-btn detail-back">${I.back()}</button>`;
  const dots = `<button class="icon-btn pm-btn">${I.dots(18)}</button>`;
  if (state.dh === "dh2")
    return `<div class="detail-head">${back}<span class="spacer"></span>${dots}</div>`;
  if (state.dh === "dh3")
    return `<div class="detail-head">${back}<span class="spacer"></span><span class="detail-title">Detail</span><span class="spacer"></span>${dots}</div>`;
  if (state.dh === "dh4") return "";
  if (state.dh === "dh5")
    return `<div class="detail-head">${back}<span class="head-av" data-pf-user="${esc(p.seller)}"><img src="${p.avatar}" alt=""></span><span class="detail-title" style="font-size:14px" data-pf-user="${esc(p.seller)}">${p.seller}</span><span class="spacer"></span>${dots}</div>`;
  return `<div class="detail-head">${back}<span class="spacer"></span><span class="detail-title">Detail</span><span class="spacer"></span>${dots}</div>`;
}

function saleTagHTML(isSale) {
  if (state.tg === "tg2") return "";
  return `<span class="inline-tag${isSale ? "" : " muted"}">${isSale ? "FOR SALE" : "SHOWCASE"}</span>`;
}

function detailHTML(p) {
  if (state.dl !== "dl1") return igDetailHTML(p);
  const spec = k => (p.specs.find(s => s[0] === k) || [k, "n/a"])[1];
  const isSale = !!p.price;
  const dots = p.photos.length > 1;
  /* hide N/A parts in the title ("rolex N/A" → "rolex"); Ref falls back to "Ref. -" */
  const na = v => /^n\/?a$/i.test((v || "").trim());
  const nm = p.specs.length ? [spec("Brand"), spec("Model")].filter(v => !na(v)).join(" ") : "";
  const name = nm || p.caption.split("—")[0].trim();
  const ref = p.specs.length ? `Ref. ${na(spec("Reference")) ? "-" : spec("Reference")}` : "";
  const cl = clipState(p);
  return `
    ${detailHeadHTML(p)}
    <div class="detail-scroll">
      <div class="detail-hero${state.dh === "dh4" ? " fabbed" : ""}${cl.has ? " clip-ph" : ""}"${cl.has ? ` data-dur="${cl.dur0}"` : ""}>
        <img src="${p.photos[0]}" alt="">
        ${dots ? `<span class="photo-counter">1/${p.photos.length}</span>` : ""}
        ${clipUiHTML(p)}
        ${state.dh === "dh4" ? `
        <button class="hero-fab fab-l detail-back">${I.back(19)}</button>
        <button class="hero-fab fab-r pm-btn">${I.dots(17)}</button>` : ""}
      </div>
      ${dots ? `<div class="photo-dots">${p.photos.map((_,i)=>`<span class="${i===0?'on':''}"></span>`).join("")}</div>` : ""}
      <div class="detail-pad">
        <div class="post-actions" style="padding:6px 0 2px;margin:0 -5px 0 -7px">
          <button class="act like-btn${p.liked ? " liked" : ""}">${I.heart(23)}</button>
          ${p.noComments ? "" : `<button class="act comment-btn">${I.comment(23)}${p.comments ? `<span>${p.comments}</span>` : ""}</button>`}
          ${p.hideCounts || !p.views || p.views === "0" ? "" : `<span class="views-stat">${I.eyeFill(20)}<span>${p.views}</span></span>`}
          <button class="act share-btn">${I.share(22)}</button>
          <span class="act-right">
            <button class="mf-btn${p.modelFollowing ? " on" : ""}" title="${p.modelFollowing ? "Following this model" : "Follow this model"}">${I.navBell(23)}</button>
            <button class="wl-btn${p.wishlisted ? " saved" : ""}" title="Wish List"><span class="wl-ic wl-o">${I.gift(23)}</span><span class="wl-ic wl-f">${I.giftFill(23)}</span></button>
          </span>
        </div>
        ${saleTagHTML(isSale)}
        <h2 class="detail-name">${name}</h2>
        ${ref ? `<div class="detail-ref">${ref}</div>` : ""}
        <div class="detail-h">Descriptions</div>
        <p class="detail-desc">${igCaptionHTML(p, p.desc || "-")}</p>
        ${detailSpecsHTML(p)}
      </div>
    </div>`;
}

/* K5 — floating chat bubble + DM-style pop-up (post preview + messages) */
function chatPopHTML(p) {
  return `
    <div class="cp-backdrop"></div>
    <button class="chat-fab" title="Chat with ${p.seller}">${I.chat(22)}</button>
    <div class="chat-pop">
      <div class="cp-head">
        <img class="cp-av" src="${p.avatar}" alt="" data-pf-user="${esc(p.seller)}">
        <div class="cp-who"><div class="n" data-pf-user="${esc(p.seller)}">${p.seller}</div></div>
        <button class="icon-btn cp-close">${I.x(16)}</button>
      </div>
      <div class="cp-body">
        <div class="cp-post">
          <img src="${p.photos[0]}" alt="">
          <div><div class="t">${p.caption}</div><div class="s">${p.price || "Showcase"}</div></div>
        </div>
        <div class="cp-thread"></div>
      </div>
      <div class="cp-input">
        <input placeholder="Message ${p.seller}...">
        <button class="cp-send" disabled>${I.send(16)}</button>
      </div>
    </div>`;
}

function closeChatPop(pd) {
  pd.querySelector(".chat-pop")?.classList.remove("show");
  pd.querySelector(".cp-backdrop")?.classList.remove("show");
  pd.classList.remove("chat-lock");
}

function sendChat(input) {
  const v = input.value.trim();
  if (!v) return;
  const pop = input.closest(".chat-pop");
  const msg = document.createElement("div");
  msg.className = "chat-msg";
  msg.textContent = v;
  pop.querySelector(".cp-thread").appendChild(msg);
  input.value = "";
  pop.querySelector(".cp-send").disabled = true;
  pop.querySelector(".cp-body").scrollTop = pop.querySelector(".cp-body").scrollHeight;
}

/* DL2 — IG-style post detail */
function igDetailHeadHTML(p) {
  return `<div class="detail-head">
    <button class="icon-btn detail-back">${I.back()}</button>
    <span class="spacer"></span>
  </div>`;
}

function igCaptionHTML(p, raw) {
  const txt = (raw ?? p.captionFull ?? p.caption).replace(/\n/g, "<br>");
  return txt.replace(/(#[A-Za-z0-9_ก-๙]+)/g, `<span class="igd-tag">$1</span>`);
}

function igBodyHTML(p, withPostHead) {
  const dots = p.photos.length > 1;
  const isSale = !!p.price;
  const priceRow = isSale
    ? state.pr === "pr4"
      ? saleTagHTML(true)
      : state.pr === "pr2"
      ? `<div class="tag-price-row">${saleTagHTML(true)}<span class="tp">${p.price}</span></div>`
      : state.pr === "pr3"
      ? `<div class="tag-price-row">${saleTagHTML(true)}<span class="price-tag">${p.price}</span></div>`
      : `${saleTagHTML(true)}<div class="detail-price">${p.price}</div>`
    : saleTagHTML(false);
  const cl = clipState(p);
  return `
    ${withPostHead ? `<header class="post-head">
      <span class="avatar-ring"><img src="${p.avatar}" alt=""></span>
      <div class="who">
        <div class="name">${p.seller}</div>
        <div class="sub-line">${p.time}</div>
      </div>
      ${p.following ? "" : `<button class="follow-btn">Follow</button>`}
      <button class="more">${I.dots(19)}</button>
    </header>` : ""}
    <div class="detail-hero${cl.has ? " clip-ph" : ""}"${cl.has ? ` data-dur="${cl.dur0}"` : ""}>
      <img src="${p.photos[0]}" alt="">
      ${dots ? `<span class="photo-counter">1/${p.photos.length}</span>` : ""}
      ${clipUiHTML(p)}
    </div>
    ${dots ? `<div class="photo-dots">${p.photos.map((_,i)=>`<span class="${i===0?'on':''}"></span>`).join("")}</div>` : ""}
    <div class="post-actions">
      <button class="act like-btn${p.liked ? " liked" : ""}">${I.heart(23)}</button>
      ${p.noComments ? "" : `<button class="act comment-btn">${I.comment(23)}${p.comments ? `<span>${p.comments}</span>` : ""}</button>`}
      ${p.hideCounts || !p.views || p.views === "0" ? "" : `<span class="views-stat">${I.eyeFill(20)}<span>${p.views}</span></span>`}
      <button class="act share-btn">${I.share(22)}</button>
      <span class="act-right">
        ${isSale && state.ask !== "bubble" ? askBtnHTML(false) : ""}
        <button class="save-btn${p.saved ? " saved" : ""}">${I.bookmark(23)}</button>
      </span>
    </div>
    ${p.hideCounts || !p.likes || !p.likedBy ? "" : `<div class="liked-by">
      <span class="stack">
        <img src="${p.likedBy.avatar}" alt="">
        <img src="./assets/user-avatars/u-1088.png" alt="">
        <img src="./assets/user-avatars/u-1120.png" alt="">
      </span>
      <span>Liked by <b data-pf-user="${esc(p.likedBy.name)}">${p.likedBy.name}</b> and others</span>
    </div>`}
    <p class="caption"><b>${p.seller}</b> ${igCaptionHTML(p)}</p>
    <div class="detail-pad">
      ${priceRow}
      ${detailSpecsHTML(p)}
    </div>`;
}

function igDetailHTML(p) {
  const isSale = !!p.price;
  return `
    ${igDetailHeadHTML(p)}
    <div class="detail-scroll">
      ${igBodyHTML(p, true)}
    </div>
    ${isSale && state.ask === "bubble" ? chatPopHTML(p) : ""}`;
}

function detailSpecsHTML(p) {
  const groups = p.specGroups || [];
  const rows = r => `<div class="spec-rows">${r.map(s => `<div class="spec-row"><span class="l">${s[0]}</span><span class="v">${s[1]}</span></div>`).join("")}</div>`;
  return specGroupsHTML(groups, rows, t => `<div class="detail-h">${t}</div>`);
}

/* shared group-layout renderer — DS1 full / DS2 accordion / DS3 cards / DS4 tabs */
function specGroupsHTML(groups, rowsFn, headFn) {
  if (!groups.length) return "";
  const rows = g => rowsFn(g.rows);
  const head = t => headFn ? headFn(t) : `<div class="spec-sec">${t}</div>`;
  if (state.ds === "acc") {
    return groups.map((g, i) => `
      <div class="ds-acc open">
        <button class="ds-acc-head"><span>${g.title}</span>${I.chev(14)}</button>
        <div class="ds-acc-body">${rows(g)}</div>
      </div>`).join("");
  }
  if (state.ds === "cards") {
    return `<div class="ds-cards">${groups.map(g => `
      <div class="ds-card">
        <div class="ds-card-h">${g.title}</div>
        ${rows(g)}
      </div>`).join("")}</div>`;
  }
  if (state.ds === "tabs" || state.ds === "seg") {
    const SHORT = { "Watch Specifications": "Watch Specs", "Item Details": "Item Details", "Price & Data Source": "Pricing" };
    const seg = state.ds === "seg";
    return `
      <div class="ds-tabs${seg ? " ds-seg" : ""}">${groups.map((g, i) => `<button class="ds-tab${i === 0 ? " active" : ""}" data-gi="${i}">${SHORT[g.title] || g.title}</button>`).join("")}</div>
      ${groups.map((g, i) => `<div class="ds-panel${i === 0 ? "" : " hidden"}" data-gi="${i}">${rows(g)}</div>`).join("")}`;
  }
  return groups.map(g => `${g.title ? head(g.title) : ""}${rows(g)}`).join("");
}

function commentRowsHTML(p) {
  return (COMMENTS[p.id] || []).map(c => `

      <img src="${c.avatar}" alt="" data-pf-user="${esc(c.name)}">
      <div class="c-main">
        <div class="c-head"><span class="n" data-pf-user="${esc(c.name)}">${c.name}</span><span>${c.time}</span></div>
        <div class="c-text">${c.text}</div>
        <span class="c-meta">Reply</span>
      </div>
      <span class="c-like">${I.heart(15)}<span>${c.likes || ""}</span></span>
    </div>
    ${(c.replies || []).map(r => `
    <div class="c-row reply">

      <div class="c-main">

      </div>
      <span class="c-like">${I.heart(15)}<span>${r.likes || ""}</span></span>
    </div>`).join("")}`).join("");
}

function commentsHTML(p) {

  return { has, d0: has ? clips[0] || null : null, dur0: has && clips[0] ? cfClipSecs(clips[0]) : "" };
}
function clipUiHTML(p) {
  const cl = clipState(p);

  return `<span class="clip-badge"${cl.d0 ? "" : ' style="display:none"'}>${I.play(11)}${cl.d0 || ""}</span><span class="prog"><i></i></span>`;
}

function feedEmptyHTML(tab) {
  const isFollowing = tab === "following";
  return `
  <div class="feed-empty">
    <span class="fe-ico">${isFollowing ? I.users(56) : I.star(56)}</span>
    <div class="fe-title">${isFollowing ? "Follow others to see their posts here" : "No favorites yet"}</div>

function feedContentHTML(variant) {
  const posts = POSTS.filter(p => !p.ni && !p.muted && !p.blocked && !p.archived)
    .filter(p => state.feedTab === "favorites" ? p.favorite : state.feedTab === "following" ? p.following : (state.snooze ? p.following : true));
  return posts.length ? posts.map(p => postCard(p, variant)).join("") : feedEmptyHTML(state.feedTab);
}

function setFeedTab(scr, tab) {
  if (state.feedTab === tab) return;
  state.feedTab = tab;
  scr.querySelectorAll(".feed-tab").forEach(x => x.classList.toggle("active", x.dataset.tab === tab));
  scr.querySelectorAll(".bm-item").forEach(x => x.classList.toggle("on", x.dataset.tab === tab));
  const fs = scr.querySelector(".feed-scroll");
  fs.innerHTML = feedContentHTML(scr.dataset.variant);
  fs.scrollTop = 0;
}

/* follow is account-level — toggle every post of the same seller.
   a button that is already rendered flips Follow<->Following in place so a
   fresh follow can be undone; after a re-render followed posts have no button */
function setFollowing(scr, seller, on) {
  POSTS.forEach(p => { if (p.seller === seller) { p.following = on; if (!on) { p.favorite = false; p.muted = false; } } }); /* unfollow also clears favorite+mute so they drop off the Settings lists */
  scr.querySelectorAll(".feed-scroll .post, .page-sub .post, .page-pv .post").forEach(art => {
    if (art.classList.contains("pfp-post")) return; /* Posts viewer cards never carry a follow btn — it lives in the pv head */
    const bp = POSTS.find(x => x.id === art.dataset.pid);
    if (!bp || bp.seller !== seller) return;
    const fb = art.querySelector(".follow-btn");
    if (fb) {
      fb.classList.toggle("on", on);
      fb.textContent = on ? "Following" : "Follow";
      return;
    }
    const head = art.querySelector(".post-head");
    if (head && !on)
      head.querySelector(".more").insertAdjacentHTML("beforebegin", `<button class="follow-btn">Follow</button>`);
  });
  const dp = POSTS.find(x => x.id === scr.dataset.detailPid);
  const db = scr.querySelector(".page-detail .follow-btn");
  if (db && dp && dp.seller === seller) {
    db.classList.toggle("on", dp.following);
    db.textContent = dp.following ? "Following" : "Follow";
  }
  if (state.feedTab === "following" || state.feedTab === "favorites" || !on) /* !on → unmuted posts may re-enter the feed */
    scr.querySelector(".feed-scroll").innerHTML = feedContentHTML(scr.dataset.variant);
}

let scrToastTimer;
function scrToast(scr, msg, thumb = "") {
  const el = scr.querySelector(".sc-toast");
  el.innerHTML = thumb ? `<img class="st-img" src="${thumb}" alt=""><span>${msg}</span>` : "";
  if (!thumb) el.textContent = msg;
  el.classList.toggle("st-top", !!thumb);
  el.classList.add("show");
  clearTimeout(scrToastTimer);
  scrToastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

const MAX_PRICE = 2000000;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const specOf = (p, k) => ((p.specs || []).find(s => s[0] === k) || [k, ""])[1];
const priceNum = p => p.price ? +p.price.replace(/[^0-9]/g, "") : null;
const viewsNum = p => String(p.views).endsWith("K") ? parseFloat(p.views) * 1000 : +p.views || 0;
const fmtNum = v => v === "" || v == null ? "" : (+v).toLocaleString("en-US");
const unNum = s => String(s).replace(/[^0-9]/g, "");

function blankFilters() {
  return { brand: [], model: [], cond: [], ref: [], year: [], csz: [], move: [], dial: [], strap: [], deliv: [], pmin: "", pmax: "" };
}
function srchState(scr) {
  if (!scr._search) scr._search = {
    mode: "landing", q: "", tab: "foryou", sort: "new", err: false,
    recents: [
      { t: "seller", v: "Watch 777" }, { t: "seller", v: "chrono.th" },
      { t: "kw", v: "rolex" }, { t: "kw", v: "grand seiko" },
      { t: "kw", v: "126610ln" }, { t: "seller", v: "wrist.story" },
    ],
    f: blankFilters(),
  };
  return scr._search;
}
function salePosts() { return POSTS.filter(p => p.price && !p.ni && !p.muted && !p.blocked); }
function haystack(p) {
  return [p.seller, p.caption, p.captionFull, ...(p.chips || []), ...(p.specs || []).flatMap(s => s)].join(" ").toLowerCase();
}
function matchQuery(p, q) {
  q = q.trim().toLowerCase();
  if (!q) return true;
  const h = haystack(p);
  return q.split(/\s+/).every(w => h.includes(w));
}
function boxText(p) { return `${specOf(p, "Box & Papers")} ${(p.chips || []).join(" ")}`; }
function delivMatch(p, v) {
  const b = boxText(p).toLowerCase();
  if (v === "Full set") return /full set|original box/.test(b);
  if (v === "With box") return /box/.test(b);
  if (v === "With papers") return /paper/.test(b);
  if (v === "Watch only") return !/box|paper/.test(b);
  return false;
}
function matchFilters(p, f) {
  if (f.brand.length && !f.brand.includes(specOf(p, "Brand"))) return false;
  if (f.model.length && !f.model.some(m => specOf(p, "Model").includes(m))) return false;
  if (f.cond.length && !f.cond.includes(specOf(p, "Condition"))) return false;
  if (f.ref.length && !f.ref.includes(specOf(p, "Reference"))) return false;
  if (f.year.length && !f.year.includes(specOf(p, "Year"))) return false;
  if (f.csz.length && !f.csz.includes(specOf(p, "Case Diameter"))) return false;
  if (f.move.length && !f.move.some(m => specOf(p, "Movement Type").includes(m))) return false;

/* settings + content-preferences pages — slide-in layer like the detail page */
function openSub(scr, name, swap) {
  scr._subStack = [name];
  scr._subSwap = !!swap;
  scr._pfAv = false;
  renderSub(scr);
  scr.classList.add("sub-open");
}
function pushSub(scr, name) {
  (scr._subStack = scr._subStack || []).push(name);
  if (scr._subStack.length === 1) scr._subSwap = false; /* fresh push root slides in — only nav tabs swap */
  scr._pfAv = false;
  renderSub(scr);
  scr.classList.add("sub-open");

function renderSub(scr) {
  const st = scr._subStack || [];
  const el = scr.querySelector(".page-sub");
  const oldBar = el.querySelector(".pf-tabs");
  if (oldBar) scr._pfTabSl = oldBar.scrollLeft; /* keep tab-bar position across re-renders */
  el.innerHTML = subHTML(st[st.length - 1], scr);
  el.classList.toggle("pg-up", (st[st.length - 1] || "").startsWith("report:pick")); /* picker look (rounded top); opens via instant swap — deeper report pages slide from the right */
  el.classList.toggle("pg-swap", !!scr._subSwap);
  const q = el.querySelector(".sr-q, .svd-q");
  if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  const onTab = el.querySelector(".pf-tab.on");
  if (onTab) { /* scroll only the tab bar — scrollIntoView would drag the whole page (overflow-x ancestors) */
    const bar = onTab.closest(".pf-tabs"), L = onTab.offsetLeft, R = L + onTab.offsetWidth;
    if (scr._pfTabSl != null) bar.scrollLeft = scr._pfTabSl;
    if (L < bar.scrollLeft) bar.scrollLeft = L - 8;
    else if (R > bar.scrollLeft + bar.clientWidth) bar.scrollLeft = R - bar.clientWidth + 8;
  }
  cfClipSync(scr); /* restore clip play/countdown state after composer re-renders */
}
function subBack(scr) {
  const st = scr._subStack || [];
  const top = st[st.length - 1];
  if (top === "saved" || top === "savedcol" || top === "wishlist" || top === "wishcol") { /* back exits saved-search/manage first, page pops after */
    const V = colState(scr);
    if (V.mode === "search") { V.mode = ""; V.q = ""; renderSub(scr); return; }
    if (V.mode === "menu") { V.mode = ""; renderSub(scr); return; }
    if (V.mode === "cover") { V.mode = "edit"; renderSub(scr); return; }
    if (V.mode === "edit") { V.mode = ""; renderSub(scr); return; }
    if (V.mode === "add") { V.mode = ""; V.addSel.clear(); renderSub(scr); return; }
    if (V.mode === "allmenu") { V.mode = "allposts"; renderSub(scr); return; }
    if (V.manage) { V.manage = false; V.sel.clear(); renderSub(scr); return; }
    if (V.mode === "allposts") { V.mode = ""; renderSub(scr); return; }
  }
  if (top === "sfilter") srchState(scr).fDraft = null;            /* back from Filters = discard draft (spec: Apply applies) */
  if (top === "search" && srchState(scr).mode === "results") {  /* back from results returns to the explore landing like IG */
    srchState(scr).mode = "landing";
    renderSub(scr);
    return;
  }
  st.pop();
  if (st.length) renderSub(scr);
  else scr.classList.remove("sub-open");
}
/* PROFILE-005 — report pages navigate like IG: a new page slides in from the
   right while the previous one stays put underneath (ghost clone), "<" slides
   the current page back out the same way, "X" closes the whole report stack */
function rpPush(scr, name) {
  const el = scr.querySelector(".page-sub");
  if ((scr._subStack || []).length) {
    const g = el.cloneNode(true);
    g.className = "pg-ghost"; /* own class — keeps selectors/queries on the real page clean */
    el.insertAdjacentElement("afterend", g);
    setTimeout(() => g.remove(), 340);
  }
  pushSub(scr, name);
  el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; /* restart slide-in */
}
function pmDropCovered(scr) { /* the '...' sheet is fully covered by the report page — snap it shut
    (no transition) so its rows don't sweep through the uncovered strips outside .page-sub;
    the backdrop must snap too or its fade-out flashes in those same strips */
  const sh = scr.querySelector(".comment-sheet"), bd = scr.querySelector(".sheet-backdrop");
  if (sh) sh.style.transition = "none";
  if (bd) bd.style.transition = "none";
  scr.classList.remove("pm-open");
  requestAnimationFrame(() => { if (sh) sh.style.transition = ""; if (bd) bd.style.transition = ""; });
}
function rpBack(scr) {
  const st = scr._subStack || [];
  if (st.length > 1) {
    const el = scr.querySelector(".page-sub");
    const g = el.cloneNode(true);
    g.className = "pg-ghost pg-out-r"; /* exiting page rides on top */
    el.insertAdjacentElement("afterend", g);
    setTimeout(() => g.remove(), 340);
    st.pop();
    scr._subSwap = true; renderSub(scr); scr._subSwap = false; /* previous page stays put — no re-slide */
  } else {
    st.pop();
    scr.classList.remove("sub-open"); /* last page slides itself out via the resting transform */
  }
}
function rpClose(scr) {
  const el = scr.querySelector(".page-sub");
  if (scr.classList.contains("sub-open")) {
    const g = el.cloneNode(true);
    g.className = "pg-ghost " + (el.classList.contains("pg-up") ? "pg-out-d" : "pg-out-r");
    el.insertAdjacentElement("afterend", g);
    setTimeout(() => g.remove(), 340);
  }
  const st = scr._subStack || [];
  while (st.length && (st[st.length - 1] || "").startsWith("report")) st.pop(); /* keep whatever opened the report flow (profile etc.) */
  if (st.length) { scr._subSwap = true; renderSub(scr); scr._subSwap = false; }
  else scr.classList.remove("sub-open");
}

/* detail entry — every spec field the post fills in becomes a criterion */
function waCriteriaFromPost(p) {
  const c = [];
  const pick = k => { const v = specOf(p, k); return naSpec(v) ? "" : v.trim(); };
  const push = (l, v, fk) => { if (v) c.push({ l, v, fk }); };
  push("Brand", pick("Brand"), "brand");
  push("Model", pick("Model"), "model");
  push("Reference", pick("Reference"), "ref");
  push("Year", pick("Year"), "year");
  push("Condition", pick("Condition"), "cond");
  push("Case Diameter", pick("Case Diameter"), "csz");
  push("Movement Type", pick("Movement Type"), "move");
  push("Dial Color", pick("Dial Color"), "dial");
  const strap = `${pick("Strap/Bracelet Material")} ${pick("Strap Material")}`.trim();
  if (strap) c.push({ l: "Strap / Bracelet", v: strap, fk: "strap" });
  SEARCH_DELIV.filter(d => delivMatch(p, d)).forEach(d => c.push({ l: "Delivery contents", v: d, fk: "deliv" }));
  const mapped = ["Brand", "Model", "Reference", "Year", "Condition", "Case Diameter", "Movement Type", "Dial Color",
    "Strap/Bracelet Material", "Strap Material", "Box & Papers",
    "Asking Price", "Estimated Market Price", "Last Price Update", "Data Source"];
  (p.specs || []).forEach(([l, v]) => {

function waCriteriaFromSearch(S) {

  for (const k in WA_FK_LABEL) S.f[k].forEach(v => c.push({ l: WA_FK_LABEL[k], v, fk: k }));
  if (S.f.pmin !== "" || S.f.pmax !== "")

/* one criterion vs one post — same semantics the search filters use */
function critMatch(p, c) {
  const spec = k => String(specOf(p, k) || "");
  const eq = (a, b) => a.trim().toLowerCase() === String(b).trim().toLowerCase();
  const inc = (a, b) => a.toLowerCase().includes(String(b).toLowerCase());
  switch (c.fk) {
    case "brand": return eq(spec("Brand"), c.v);
    case "model": return inc(spec("Model"), c.v);
    case "cond":  return eq(spec("Condition"), c.v);
    case "ref":   return eq(spec("Reference"), c.v);
    case "year":  return eq(spec("Year"), c.v);
    case "csz":   return eq(spec("Case Diameter"), c.v);
    case "move":  return inc(spec("Movement Type"), c.v);
    case "dial":  return inc(spec("Dial Color"), c.v);
    case "strap": return inc(`${spec("Strap/Bracelet Material")} ${spec("Strap Material")}`, c.v);

function portfolioHTML(scr) {

/* swap a clip-capable media box to slide i — badge/countdown follow the slide's own dur */
function phClipSet(ph, post, i) {
  if (!ph.classList.contains("clip-ph")) return;
  const dur = post.clips && post.clips[i];
  ph.dataset.dur = dur ? cfClipSecs(dur) : "";
  delete ph.dataset.rem;
  ph.classList.remove("playing");
  const b = ph.querySelector(".clip-badge");
  if (b) { b.style.display = dur ? "" : "none"; if (dur) b.innerHTML = `${I.play(11)}${dur}`; }
  const bar = ph.querySelector(".prog i");
  if (bar) bar.style.width = "0";
}
function applyPhoto(ph, post, i, dotsEl) {
  ph.dataset.i = i;
  ph.querySelector("img").src = post.photos[i];
  const c = ph.querySelector(".photo-counter");
  if (c) c.textContent = `${i + 1}/${post.photos.length}`;
  if (dotsEl) [...dotsEl.children].forEach((d, j) => d.classList.toggle("on", j === i));
  phClipSet(ph, post, i);
}
/* CREATE-001 — caption thumbs strip + hashtag chips: wheel + drag to scroll (desktop has no scrollbar) */

/* FEED-024 — caption thumbs: press and hold a thumb to drag it into a new order (IG edit info) */
let reordDrag = null;
stageEl.addEventListener("pointerdown", e => {
  const th = e.target.closest(".cf .ig-thumbs.multi .ig-thumb");
  if (!th || th.classList.contains("ig-add")) return;
  const strip = th.closest(".ig-thumbs");
  const scr = th.closest(".screen");
  const idx = [...strip.querySelectorAll(".ig-thumb:not(.ig-add)")].indexOf(th);
  reordDrag = { th, strip, scr, idx, x0: e.clientX, lx: e.clientX, active: false, t: setTimeout(() => {
    if (reordDrag && Math.abs(reordDrag.lx - reordDrag.x0) <= 10) {
      reordDrag.active = true;
      reordDrag.th.classList.add("drag");
      stripDrag = null; /* hand the gesture to reorder, not strip scroll */
    }
  }, 380) };
});
stageEl.addEventListener("pointermove", e => {
  if (!reordDrag) return;
  reordDrag.lx = e.clientX;
  const dx = e.clientX - reordDrag.x0;
  if (!reordDrag.active) { if (Math.abs(dx) > 10) { clearTimeout(reordDrag.t); reordDrag = null; } return; }
  reordDrag.th.style.transform = `translateX(${dx}px)`;
});
["pointerup", "pointercancel"].forEach(ev => stageEl.addEventListener(ev, e => {
  if (!reordDrag) return;

stageEl.addEventListener("pointerdown", e => {
  const ph = e.target.closest(".post-photo, .detail-hero");
  if (!ph) return;
  const { post, dotsEl } = photoCtx(ph);
  if (!post || post.photos.length < 2) return;
  swipe = { ph, post, dotsEl, x0: e.clientX, y0: e.clientY, dx: 0, i: +(ph.dataset.i || 0), moved: false };
});
stageEl.addEventListener("pointermove", e => {
  if (!swipe) return;
  swipe.dx = e.clientX - swipe.x0;
  if (!swipe.moved) {
    const dy = e.clientY - swipe.y0;
    if (Math.abs(dy) > Math.abs(swipe.dx) + 4) { swipe = null; return; } /* vertical scroll wins — don't translate the photo */
    if (Math.abs(swipe.dx) > 8) swipe.moved = true;
  }
  if (!swipe.moved) return;
  let eff = swipe.dx;
  const last = swipe.post.photos.length - 1;
  if ((swipe.i === 0 && eff > 0) || (swipe.i === last && eff < 0)) eff *= 0.35;
  const img = swipe.ph.querySelector("img");
  img.style.transition = "none";
  img.style.transform = `translateX(${eff}px)`;
});
function endSwipe() {
  if (!swipe) return;
  const { ph, post, dotsEl, dx, i, moved } = swipe;
  swipe = null;
  if (!moved) return;
  suppressPhotoClick = true;
  setTimeout(() => { suppressPhotoClick = false; }, 60);
  const img = ph.querySelector("img");
  const w = ph.clientWidth;
  img.style.transition = "transform .22s ease";
  if (Math.abs(dx) > Math.min(64, w * 0.2)) {
    const dir = dx < 0 ? 1 : -1;
    const ni = i + dir;
    if (ni < 0 || ni > post.photos.length - 1) {
      img.style.transform = "translateX(0)";
      return;
    }
    img.style.transform = `translateX(${dir * -w}px)`;
    setTimeout(() => {
      applyPhoto(ph, post, ni, dotsEl);
      img.style.transition = "none";
      img.style.transform = `translateX(${dir * w}px)`;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        img.style.transition = "transform .22s ease";
        img.style.transform = "translateX(0)";
      }));
    }, 200);
  } else {
    img.style.transform = "translateX(0)";
  }
}
stageEl.addEventListener("pointerup", endSwipe);
stageEl.addEventListener("pointercancel", endSwipe);
