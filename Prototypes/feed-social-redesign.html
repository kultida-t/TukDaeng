<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TukDaeng — Feed Social Redesign (Exploration)</title>
<style>
  @font-face {
    font-family: "IBM Plex Sans Thai";
    font-weight: 400;
    src: url("./assets/fonts/google/IBMPlexSansThai-Regular.ttf") format("truetype");
  }
  @font-face {
    font-family: "IBM Plex Sans Thai";
    font-weight: 500;
    src: url("./assets/fonts/google/IBMPlexSansThai-Medium.ttf") format("truetype");
  }
  @font-face {
    font-family: "IBM Plex Sans Thai";
    font-weight: 600;
    src: url("./assets/fonts/google/IBMPlexSansThai-SemiBold.ttf") format("truetype");
  }
  @font-face {
    font-family: "Bebas Neue";
    src: url("./assets/fonts/google/BebasNeue-Regular.ttf") format("truetype");
  }

  :root {
    --red: #c8212b;
    --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "IBM Plex Sans Thai", Arial, sans-serif;
    --font-brand: var(--font-main);
    --page-bg: #1a1a1e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-main);
    background: var(--page-bg);
    color: #e8e8ec;
    min-height: 100vh;
    display: flex;
    flex-direction: row;
  }

  /* ============ REVIEW SIDEBAR ============ */
  .review-bar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: 250px;
    z-index: 50;
    background: #111114;
    border-right: 1px solid #2a2a30;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
  }
  .review-bar .title {
    font-family: var(--font-brand);
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: var(--red);
  }
  .review-bar .sub {
    font-size: 12px;
    color: #8b8b95;
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .variant-btn {
    font-family: var(--font-main);
    font-size: 13px;
    text-align: left;
    padding: 9px 14px;
    border-radius: 10px;
    border: 1px solid #3a3a42;
    background: transparent;
    color: #c8c8d0;
    cursor: pointer;
    transition: all .15s ease;
  }
  .variant-btn:hover { border-color: #6b6b76; color: #fff; }
  .variant-btn.active {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
    font-weight: 600;
  }
  .variant-label {
    font-size: 12px;
    color: #8b8b95;
    line-height: 1.5;
    margin-top: 8px;
    padding-top: 12px;
    border-top: 1px solid #2a2a30;
  }
  .grp-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #6b6b76;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid #2a2a30;
  }

  /* ============ PHONE PAIR ============ */
  .stage {
    display: flex;
    gap: 48px;
    padding: 40px 24px 64px;
    margin-left: 250px;
    flex: 1;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
  }
  .phone-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .theme-tag {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #8b8b95;
  }
  .phone {
    width: 390px;
    height: 844px;
    border-radius: 44px;
    padding: 10px;
    background: #000;
    box-shadow: 0 24px 64px rgba(0,0,0,.55), inset 0 0 0 2px #2e2e33;
    position: relative;
    flex-shrink: 0;
  }
  .screen {
    width: 100%;
    height: 100%;
    border-radius: 34px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* theme tokens on each screen */
  .screen[data-theme="dark"] {
    --bg: #0b0b0d;
    --surface: #16161a;
    --surface-2: #1e1e24;
    --line: #26262c;
    --text: #f2f2f5;
    --muted: #9a9aa3;
    --chip-bg: rgba(255,255,255,.08);
    --chip-text: #d6d6dc;
    --btn-gray: #2b2b31;
    background: var(--bg);
    color: var(--text);
  }
  .screen[data-theme="light"] {
    --bg: #f6f6f8;
    --surface: #ffffff;
    --surface-2: #f0f0f3;
    --line: #e4e4e9;
    --text: #141417;
    --muted: #6d6d78;
    --chip-bg: rgba(0,0,0,.06);
    --chip-text: #3a3a42;
    --btn-gray: #ededf0;
    background: var(--bg);
    color: var(--text);
  }

  /* ============ STATUS BAR ============ */
  .statusbar {
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .statusbar .icons { display: flex; gap: 5px; align-items: center; opacity: .8; }
  .statusbar svg { display: block; }

  /* ============ APP HEADER ============ */
  .app-header {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px 8px;
    flex-shrink: 0;
    position: relative;
  }
  .app-header .wordmark {
    font-family: var(--font-main);
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: var(--red);
    line-height: 1;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: default;
  }
  .wordmark .caret { display: none; color: var(--text); opacity: .85; }
  .screen[data-ft="none"] .wordmark { cursor: pointer; }
  .screen[data-ft="none"] .wordmark .caret { display: inline-flex; }

  /* brand feed dropdown (F4 — pure IG) */
  .brand-menu {
    position: absolute;
    top: 78px;
    left: 50%;
    transform: translateX(-50%) translateY(-6px);
    width: 180px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 6px;
    z-index: 70;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .screen.brand-open .brand-menu { opacity: 1; pointer-events: auto; transform: translateX(-50%); }
  .brand-menu button {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border: none;
    background: none;
    color: var(--text);
    font-family: var(--font-main);
    font-size: 13.5px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
  }
  .brand-menu button:hover { background: var(--chip-bg); }
  .brand-menu .check { opacity: 0; }
  .brand-menu button.on .check { opacity: 1; }
  .app-header .spacer { margin-left: auto; }
  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--chip-bg); }
  .icon-btn svg { display: block; }

  /* ============ FEED TABS ============ */
  .feed-tabs {
    display: flex;
    gap: 24px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .feed-tab {
    font-family: var(--font-main);
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    background: none;
    border: none;
    padding: 8px 2px 10px;
    cursor: pointer;
    position: relative;
  }
  .feed-tab.active { color: var(--text); }
  .feed-tab.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: var(--red);
    border-radius: 2px 2px 0 0;
  }

  /* FT1c — text centered */
  .screen[data-ft="textc"] .feed-tabs { justify-content: center; gap: 32px; }
  /* FT2c — chips centered */
  .screen[data-ft="chipsc"] .feed-tabs { justify-content: center; }

  /* FT2 — chips */
  .screen[data-ft="chips"] .feed-tabs,
  .screen[data-ft="chipsc"] .feed-tabs { gap: 8px; padding: 8px 12px; border-bottom: none; }
  .screen[data-ft="chips"] .feed-tab,
  .screen[data-ft="chipsc"] .feed-tab {
    padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--chip-bg); color: var(--chip-text);
    font-size: 12.5px;
  }
  .screen[data-ft="chips"] .feed-tab.active,
  .screen[data-ft="chipsc"] .feed-tab.active { background: var(--red); color: #fff; border-color: var(--red); }
  .screen[data-ft="chips"] .feed-tab.active::after,
  .screen[data-ft="chipsc"] .feed-tab.active::after { display: none; }

  /* FT3 — segmented */
  .screen[data-ft="segment"] .feed-tabs {
    gap: 0; margin: 4px 12px 6px; padding: 3px;
    border: none; background: var(--chip-bg); border-radius: 999px;
  }
  .screen[data-ft="segment"] .feed-tab { flex: 1; padding: 7px 0; border-radius: 999px; font-size: 12.5px; text-align: center; }
  .screen[data-ft="segment"] .feed-tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.18); }
  .screen[data-ft="segment"] .feed-tab.active::after { display: none; }

  /* FT4 — none (pure IG) */
  .screen[data-ft="none"] .feed-tabs { display: none; }

  /* ============ FEED SCROLL ============ */
  .feed-scroll {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .feed-scroll::-webkit-scrollbar { display: none; }

  /* ============ POST ============ */
  .post { margin-bottom: 28px; }
  .post-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px 10px 16px;
  }
  .avatar-ring {
    width: 38px; height: 38px;
    border-radius: 50%;
    padding: 2px;
    background: linear-gradient(45deg, var(--red), #7a1218);
    flex-shrink: 0;
  }
  .avatar-ring img {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    border: 2px solid var(--bg);
  }
  .post-head .who { flex: 1; min-width: 0; }
  .post-head .name {
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.3;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .post-head .sub-line {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.3;
  }
  .follow-btn {
    font-family: var(--font-main);
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    background: var(--btn-gray);
    border: none;
    border-radius: 10px;
    padding: 7px 16px;
    cursor: pointer;
  }
  .post-head .more {
    color: var(--muted);
    background: none; border: none; cursor: pointer;
    padding: 4px;
    display: flex;
  }

  /* photo */
  .post-photo {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    overflow: hidden;
    background: #000;
  }
  .post-photo img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-counter {
    position: absolute;
    top: 12px; right: 12px;
    background: rgba(20,20,24,.72);
    backdrop-filter: blur(6px);
    color: #fff;
    font-size: 11.5px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .photo-dots {
    display: flex;
    justify-content: center;
    gap: 5px;
    padding: 9px 0 2px;
  }
  .photo-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--line);
  }
  .photo-dots span.on { background: var(--red); }
  .type-tag {
    position: absolute;
    top: 12px; left: 12px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
  }
  .type-tag.sale { background: rgba(200,33,43,.85); color: #fff; }
  .type-tag.showcase { background: rgba(20,20,24,.6); color: rgba(255,255,255,.85); }
  .price-overlay {
    position: absolute;
    bottom: 12px; left: 12px;
    background: rgba(15,15,18,.62);
    backdrop-filter: blur(8px);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 999px;
  }
  .cond-overlay {
    position: absolute;
    top: 12px; left: 12px;
    background: rgba(15,15,18,.62);
    backdrop-filter: blur(8px);
    color: rgba(255,255,255,.9);
    font-size: 11px;
    font-weight: 500;
    padding: 5px 11px;
    border-radius: 999px;
  }

  /* action row */
  .post-actions {
    display: flex;
    align-items: center;
    padding: 8px 12px 2px;
    gap: 2px;
  }
  .act {
    display: flex;
    align-items: center;
    gap: 5px;
    background: none; border: none;
    color: var(--text);
    font-family: var(--font-main);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    padding: 5px 7px;
    border-radius: 8px;
  }
  .act:hover { background: var(--chip-bg); }
  .act svg { display: block; }
  .act.liked svg path { fill: var(--red); stroke: var(--red); }
  .act-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .ask-pill {
    font-family: var(--font-main);
    font-size: 12.5px;
    font-weight: 600;
    border-radius: 999px;
    padding: 6px 15px;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .ask-pill.outline {
    background: none;
    border: 1.2px solid var(--muted);
    color: var(--text);
  }
  .ask-pill.solid {
    background: var(--red);
    border: none;
    color: #fff;
  }
  .ask-pill.txt {
    background: none;
    border: none;
    color: var(--red);
    padding: 6px 8px;
  }
  .ask-pill.ico {
    background: none;
    border: none;
    color: var(--text);
    padding: 6px;
    border-radius: 50%;
  }
  .ask-pill.ico svg { width: 21px; height: 21px; }
  .save-btn {
    background: none; border: none;
    color: var(--text);
    padding: 5px;
    cursor: pointer;
    display: flex;
  }

  /* liked-by / caption / details */
  .liked-by {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 16px 0;
    font-size: 12.5px;
    color: var(--text);
  }
  .liked-by .stack { display: flex; }
  .liked-by img {
    width: 18px; height: 18px;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid var(--bg);
  }
  .liked-by .stack img + img { margin-left: -6px; }
  .liked-by b { font-weight: 600; }
  .comment-preview {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 16px 0;
    font-size: 13px;
    color: var(--text);
  }
  .comment-preview .txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .comment-preview b { font-weight: 600; }
  .comment-preview svg { color: var(--muted); flex-shrink: 0; }
  .post-time {
    padding: 4px 16px 0;
    font-size: 12px;
    color: var(--muted);
  }
  .caption {
    padding: 4px 16px 0;
    font-size: 13.5px;
    line-height: 1.5;
  }
  .caption b { font-weight: 600; }
  .caption .more-link { color: var(--muted); cursor: pointer; }
  .caption .cap-full { display: none; }
  .caption.expanded .cap-short { display: none; }
  .caption.expanded .cap-full { display: inline; }
  .quiet-price {
    padding: 3px 16px 0;
    font-size: 13px;
    color: var(--muted);
  }
  .details-toggle {
    margin: 8px 16px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 9px 13px;
    font-family: var(--font-main);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    width: calc(100% - 32px);
  }
  .details-toggle svg { transition: transform .2s ease; color: var(--muted); }
  .details-toggle.open svg { transform: rotate(180deg); }
  .details-body {
    margin: 0 16px;
    max-height: 0;
    overflow: hidden;
    transition: max-height .3s ease, margin-top .25s ease;
  }
  .details-body.open { max-height: 2000px; margin-top: 8px; }
  .details-inner {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 13px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .details-price {
    font-size: 15px;
    font-weight: 600;
    color: var(--red);
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--chip-text);
    background: var(--chip-bg);
    border-radius: 999px;
    padding: 4px 10px;
  }

  /* trigger styles */
  .details-toggle.ln,
  .details-toggle.txt {
    background: none;
    border: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
  }
  .details-toggle.ln i,
  .details-toggle.txt i {
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .details-toggle.ln .knob {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    flex-shrink: 0;
  }
  .details-toggle.txt {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .03em;
  }
  .details-toggle.txt svg { color: var(--muted); }

  /* D1 spec tiles grid */
  .spec-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }
  .spec-tile {
    background: var(--chip-bg);
    border-radius: 11px;
    padding: 8px 11px;
  }
  .spec-tile .l {
    font-size: 10.5px;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .spec-tile .v {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
  }
  /* D2 list rows */
  .spec-rows { display: flex; flex-direction: column; }
  .spec-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 7px 2px;
    font-size: 13px;
  }
  .spec-row + .spec-row { border-top: 1px solid var(--line); }
  .spec-row .l { color: var(--muted); }
  .spec-row .v { font-weight: 600; text-align: right; }

  /* B3 price footer */
  .price-footer {
    margin: 10px 14px 12px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .price-footer .p {
    font-size: 15px;
    font-weight: 600;
    color: var(--red);
  }

  /* ============ CARD (B + C variants) ============ */
  .screen[data-variant^="b"] .feed-scroll,
  .screen[data-variant^="c"] .feed-scroll { padding: 10px 12px 0; }
  .screen[data-variant^="b"] .post,
  .screen[data-variant^="c"] .post {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .screen[data-variant^="b"] .post-photo {
    margin: 0 10px;
    width: calc(100% - 20px);
    border-radius: 14px;
  }
  .screen[data-variant^="b"] .post-head { padding: 12px 14px 12px 14px; }
  .screen[data-variant^="b"] .liked-by,
  .screen[data-variant^="b"] .caption,
  .screen[data-variant^="b"] .quiet-price,
  .screen[data-variant^="c"] .liked-by,
  .screen[data-variant^="c"] .caption,
  .screen[data-variant^="c"] .quiet-price { padding-left: 14px; padding-right: 14px; }
  .screen[data-variant^="b"] .details-toggle { margin-left: 14px; width: calc(100% - 28px); }
  .screen[data-variant^="b"] .details-body { margin-left: 14px; margin-right: 14px; }
  .screen[data-variant^="b"] .post-actions { padding-left: 8px; padding-right: 8px; }
  .screen[data-variant^="b"] .post > :last-child,
  .screen[data-variant^="c"] .post > :last-child { margin-bottom: 12px; }
  .screen[data-variant^="c"] .post-time { padding-bottom: 10px; }

  /* ============ DETAIL PAGE (Layer 3) ============ */
  .page-detail {
    position: absolute;
    top: 34px;
    bottom: 22px;
    left: 0;
    right: 0;
    background: var(--bg);
    transform: translateX(100%);
    transition: transform .28s ease;
    z-index: 30;
    display: flex;
    flex-direction: column;
  }
  .screen.detail-open .page-detail { transform: none; }
  .detail-head {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 8px 12px;
    flex-shrink: 0;
  }

const state = { variant: "a1", tStyle: "t3", dStyle: "d2", nav: "labeled", ft: "chipsc", ask: "outline", ds: "full", pr: "pr1", dh: "dh1" };

function askBtnHTML(defaultSolid) {
  const style = state.ask === "auto" ? (defaultSolid ? "solid" : "outline") : state.ask;
  if (style === "ico") return `<button class="ask-pill ico" title="Ask seller">${I.chat(21)}</button>`;
  if (style === "txt") return `<button class="ask-pill txt">Ask</button>`;
  return `<button class="ask-pill ${style}">${I.chat(14)} Ask</button>`;
}

function triggerHTML() {
  const lbl = `<span class="dt-label">Tap for details</span>`;
  if (state.tStyle === "t2")
    return `<button class="details-toggle ln"><i></i><span class="knob">${I.chev(13)}</span><i></i></button>`;
  if (state.tStyle === "t3")
    return `<button class="details-toggle txt"><i></i>${lbl}${I.chev(13)}<i></i></button>`;
  return `<button class="details-toggle">${lbl}${I.chev()}</button>`;
}

function detailsHTML(p, showPriceRow) {
  const groups = (p.specGroups && p.specGroups.length) ? p.specGroups : [{ title: "", rows: p.specs }];
  const renderRows = {
    d1: rows => `<div class="spec-grid">${rows.map(s => `<div class="spec-tile"><div class="l">${s[0]}</div><div class="v">${s[1]}</div></div>`).join("")}</div>`,
    d2: rows => `<div class="spec-rows">${rows.map(s => `<div class="spec-row"><span class="l">${s[0]}</span><span class="v">${s[1]}</span></div>`).join("")}</div>`,
    d3: rows => `<div class="chip-row">${rows.map(s => `<span class="chip"><b>${s[0]}:</b>&nbsp;${s[1]}</span>`).join("")}</div>`,
  }[state.dStyle];
  const content = specGroupsHTML(groups, renderRows, t => `<div class="spec-sec">${t}</div>`);
  return `
    <div class="details-body">
      <div class="details-inner">
        <div class="details-top">
          ${showPriceRow ? `<div class="details-price">${p.price}</div>` : `<span></span>`}
          <span class="view-full">View full detail ${I.chevR()}</span>
        </div>
        ${content}
      </div>
    </div>`;
}

function detailHeadHTML(p) {
  const back = `<button class="icon-btn detail-back">${I.back()}</button>`;
  const dots = `<button class="icon-btn">${I.dots(18)}</button>`;
  if (state.dh === "dh2")
    return `<div class="detail-head">${back}<span class="spacer"></span>${dots}</div>`;
  if (state.dh === "dh3")
    return `<div class="detail-head">${back}<span class="spacer"></span><span class="detail-title">Detail</span><span class="spacer"></span>${dots}</div>`;
  if (state.dh === "dh4") return "";
  if (state.dh === "dh5")
    return `<div class="detail-head">${back}<span class="head-av"><img src="${p.avatar}" alt=""></span><span class="detail-title" style="font-size:14px">${p.seller}</span><span class="spacer"></span>${dots}</div>`;
  return `<div class="detail-head">${back}<span class="detail-title">Detail</span><span class="spacer"></span>${dots}</div>`;
}

function detailHTML(p) {
  const spec = k => (p.specs.find(s => s[0] === k) || [k, "n/a"])[1];
  const isSale = !!p.price;
  const dots = p.photos.length > 1;
  const name = p.specs.length ? `${spec("Brand")} ${spec("Model")}` : p.caption.split("—")[0].trim();
  const ref = p.specs.length && spec("Reference") !== "n/a" ? `Ref. ${spec("Reference")}` : "";
  return `
    ${detailHeadHTML(p)}
    <div class="detail-scroll">
      <div class="detail-hero${state.dh === "dh4" ? " fabbed" : ""}">
        <img src="${p.photos[0]}" alt="">
        <span class="photo-counter">1/${p.photos.length}</span>
        ${state.dh === "dh4" ? `
        <button class="hero-fab fab-l detail-back">${I.back(19)}</button>
        <button class="hero-fab fab-r">${I.dots(17)}</button>` : ""}
      </div>
      ${dots ? `<div class="photo-dots">${p.photos.map((_,i)=>`<span class="${i===0?'on':''}"></span>`).join("")}</div>` : ""}
      <div class="detail-pad">
        <div class="post-actions" style="padding-left:0;padding-right:0;padding-top:6px">
          <button class="act like-btn">${I.heart(23)}<span>${p.likes}</span></button>
          <button class="act comment-btn">${I.comment(23)}<span>${p.comments}</span></button>
          <button class="act">${I.eye(24)}<span>${p.views}</span></button>
          <button class="act">${I.share(22)}</button>
          <span class="act-right">
            ${isSale ? askBtnHTML(false) : ""}
            <button class="save-btn">${I.bookmark(23)}</button>
          </span>
        </div>
        ${isSale && state.pr === "pr2"
          ? `<div class="tag-price-row"><span class="inline-tag">FOR SALE</span><span class="tp">${p.price}</span></div>`
          : isSale && state.pr === "pr3"
          ? `<div class="tag-price-row"><span class="inline-tag">FOR SALE</span><span class="price-tag">${p.price}</span></div>`
          : `<span class="inline-tag ${isSale ? "" : "muted"}">${isSale ? "FOR SALE" : "SHOWCASE"}</span>`}
        <h2 class="detail-name">${name}</h2>
        ${ref ? `<div class="detail-ref">${ref}</div>` : ""}
        <div class="detail-seller">
          <span class="avatar-ring"><img src="${p.avatar}" alt=""></span>
          <div class="who"><div class="name" style="font-size:14px;font-weight:600">${p.seller}</div></div>

        ${isSale && state.pr === "pr1" ? `<div class="detail-price">${p.price}</div>` : ""}
        <div class="detail-h">Descriptions</div>
        <p class="detail-desc">${p.desc}</p>
        ${detailSpecsHTML(p)}
      </div>

}

function detailSpecsHTML(p) {
  const groups = p.specGroups || [];
  const rows = r => `<div class="spec-rows">${r.map(s => `<div class="spec-row"><span class="l">${s[0]}</span><span class="v">${s[1]}</span></div>`).join("")}</div>`;
  return specGroupsHTML(groups, rows, t => `<div class="detail-h">${t}</div>`);
}

/* shared group-layout renderer — DS1 full / DS2 accordion / DS3 cards / DS4 tabs */
function specGroupsHTML(groups, rowsFn, headFn) {
  if (!groups.length) return "";
  const rows = g => rowsFn(g.rows);
  const head = t => headFn ? headFn(t) : `<div class="spec-sec">${t}</div>`;
  if (state.ds === "acc") {
    return groups.map((g, i) => `
      <div class="ds-acc${i === 0 ? " open" : ""}">
        <button class="ds-acc-head"><span>${g.title}</span>${I.chev(14)}</button>
        <div class="ds-acc-body">${rows(g)}</div>
      </div>`).join("");
  }
  if (state.ds === "cards") {
    return `<div class="ds-cards">${groups.map(g => `
      <div class="ds-card">
        <div class="ds-card-h">${g.title}</div>
        ${rows(g)}
      </div>`).join("")}</div>`;
  }
  if (state.ds === "tabs" || state.ds === "seg") {
    const SHORT = { "Watch Specifications": "Watch Specs", "Item Details": "Item Details", "Price & Data Source": "Pricing" };
    const seg = state.ds === "seg";
    return `
      <div class="ds-tabs${seg ? " ds-seg" : ""}">${groups.map((g, i) => `<button class="ds-tab${i === 0 ? " active" : ""}" data-gi="${i}">${SHORT[g.title] || g.title}</button>`).join("")}</div>
      ${groups.map((g, i) => `<div class="ds-panel${i === 0 ? "" : " hidden"}" data-gi="${i}">${rows(g)}</div>`).join("")}`;
  }
  return groups.map(g => `${g.title ? head(g.title) : ""}${rows(g)}`).join("");
}

function commentsHTML(p) {

      </div>
      <span class="c-like">${I.heart(15)}<span>${c.likes || ""}</span></span>

    <div class="c-row reply">
      <img src="${r.avatar}" alt="">
      <div class="c-main">
        <div class="c-head"><span class="n">${r.name}</span><span>${r.time}</span></div>

    <div class="sheet-handle"></div>
    <div class="sheet-title">Comments<button class="send">${I.share(18)}</button></div>

    <div class="comment-input">
      <img src="./assets/user-avatars/u-1075.png" alt="">
      <span class="field">Add a comment...</span>
      <span class="ci-ic">${I.img(20)}${I.gif(20)}</span>
    </div>`;

function postCard(p, variant) {
  const isMixed = variant === "mixed";
  const type = isMixed && p.type === "showcase" ? "showcase" : (isMixed ? "sale" : null);
  const hasPrice = p.price !== null;
  const priceOverlay = (variant === "a2" || variant === "b2" || variant === "c2") && hasPrice;
  const quietPrice = variant === "a3" && hasPrice;
  const footerPrice = (variant === "b3" || variant === "c3") && hasPrice;
  const showTag = isMixed;
  const askSolid = (variant === "a2" || variant === "b2" || variant === "c2");
  const showAsk = p.type === "sale" || !isMixed;
  const dots = p.photos.length > 1;

  return `
  <article class="post" data-pid="${p.id}">
    <header class="post-head">
      <span class="avatar-ring"><img src="${p.avatar}" alt=""></span>
      <div class="who">
        <div class="name">${p.seller}</div>
      </div>
      ${!p.following ? `<button class="follow-btn">Follow</button>` : ""}
      <button class="more">${I.listMenu(19)}</button>
    </header>

    <div class="post-photo">
      <img src="${p.photos[0]}" alt="">
      ${dots ? `<span class="photo-counter">1/${p.photos.length}</span>` : ""}
      ${showTag && type === "sale" ? `<span class="type-tag sale">FOR SALE</span>` : ""}
      ${showTag && type === "showcase" ? `<span class="type-tag showcase">SHOWCASE</span>` : ""}
      ${priceOverlay ? `<span class="cond-overlay">${p.chips[0]}</span>` : ""}
      ${priceOverlay ? `<span class="price-overlay">${p.price}</span>` : ""}
    </div>

    ${dots ? `<div class="photo-dots">${p.photos.map((_,i)=>`<span class="${i===0?'on':''}"></span>`).join("")}</div>` : ""}

    <div class="post-actions">
      <button class="act like-btn">${I.heart(23)}<span>${p.likes}</span></button>
      <button class="act comment-btn">${I.comment(23)}<span>${p.comments}</span></button>

        ${showAsk ? askBtnHTML(askSolid) : ""}

      </span>
    </div>

    <div class="liked-by">
      <span class="stack">
        <img src="${p.likedBy.avatar}" alt="">
        <img src="./assets/user-avatars/u-1088.png" alt="">
        <img src="./assets/user-avatars/u-1120.png" alt="">
      </span>
      <span><b>${p.likedBy.name}</b> and <b>others</b> liked</span>
    </div>

    <p class="caption"><b>${p.seller}</b> <span class="cap-short">${p.caption} <span class="more-link">more</span></span><span class="cap-full">${p.captionFull.replace(/\n/g, "<br>")}</span></p>

    <div class="post-time">${p.time}</div>

    ${quietPrice ? `<p class="quiet-price">${p.price}</p>` : ""}

    ${hasPrice ? triggerHTML() + detailsHTML(p, !priceOverlay && !quietPrice && !footerPrice) : ""}

    ${footerPrice ? `
      <div class="price-footer">
        <span class="p">${p.price}</span>
        <button class="ask-pill outline">Ask Seller</button>
      </div>` : ""}
  </article>`;
}

      <span class="nav-item">${I.navChat()}<span class="nav-badge">1</span><span class="nav-label">Chat</span></span>
      <span class="nav-item">${I.navBoards()}<span class="nav-label">Boards</span></span>
      <span class="nav-item">${I.navBell()}<span class="nav-badge">9</span><span class="nav-label">Alerts</span></span>

function render() {
  document.getElementById("stage").innerHTML =
    `<div class="phone-wrap"><span class="theme-tag">Dark</span><div class="phone">${screenHTML("dark", state.variant)}</div></div>` +
    `<div class="phone-wrap"><span class="theme-tag">Light</span><div class="phone">${screenHTML("light", state.variant)}</div></div>`;
  document.getElementById("variantDesc").textContent = VARIANT_DESC[state.variant];
}

document.getElementById("stage").addEventListener("click", e => {
  const wm = e.target.closest(".wordmark");
  if (wm) {
    const scr = wm.closest(".screen");
    if (scr.dataset.ft === "none") scr.classList.toggle("brand-open");
    return;
  }
  const bm = e.target.closest(".bm-item");
  if (bm) {
    [...bm.parentElement.children].forEach(x => x.classList.toggle("on", x === bm));
    bm.closest(".screen").classList.remove("brand-open");
    return;
  }
  document.querySelectorAll(".screen.brand-open").forEach(s => s.classList.remove("brand-open"));
  const back = e.target.closest(".detail-back");
  if (back) {
    back.closest(".screen").classList.remove("detail-open");
    return;
  }
  const accH = e.target.closest(".ds-acc-head");
  if (accH) {
    accH.parentElement.classList.toggle("open");
    return;
  }
  const dst = e.target.closest(".ds-tab");
  if (dst) {
    const tabsWrap = dst.closest(".ds-tabs");
    [...tabsWrap.children].forEach(x => x.classList.toggle("active", x === dst));
    tabsWrap.parentElement.querySelectorAll(":scope > .ds-panel").forEach(pl => pl.classList.toggle("hidden", pl.dataset.gi !== dst.dataset.gi));
    return;
  }
  const intoDetail = e.target.closest(".details-inner");
  if (intoDetail) {
    const art = e.target.closest(".post");
    const post = POSTS.find(x => x.id === art.dataset.pid);
    const scr = e.target.closest(".screen");
    const pd = scr.querySelector(".page-detail");
    pd.innerHTML = detailHTML(post);
    pd.querySelector(".detail-scroll").scrollTop = 0;
    scr.scrollTop = 0;
    scr.dataset.detailPid = post.id;
    scr.classList.add("detail-open");
    return;
  }
  const cbtn = e.target.closest(".comment-btn");
  if (cbtn) {
    const scr = e.target.closest(".screen");
    const art = e.target.closest(".post");
    const pid = art ? art.dataset.pid : scr.dataset.detailPid;
    const post = POSTS.find(x => x.id === pid);
    scr.querySelector(".comment-sheet").innerHTML = commentsHTML(post);
    scr.classList.add("comments-open");
    return;
  }
  const closeSheet = e.target.closest(".sheet-backdrop, .sheet-handle");
  if (closeSheet) {
    closeSheet.closest(".screen").classList.remove("comments-open");
    return;
  }
  const clike = e.target.closest(".c-like");
  if (clike) {
    clike.classList.toggle("liked");
    const n = clike.querySelector("span");
    if (n.textContent !== "") n.textContent = parseInt(n.textContent) + (clike.classList.contains("liked") ? 1 : -1);
    else if (clike.classList.contains("liked")) n.textContent = "1";
    return;
  }
  const ft = e.target.closest(".feed-tab");
  if (ft) {
    [...ft.parentElement.children].forEach(x => x.classList.toggle("active", x === ft));
    return;
  }
  const ph = e.target.closest(".post-photo");
  if (ph) {
    const art = ph.closest(".post");
    const post = POSTS.find(x => x.id === art.dataset.pid);
    if (post && post.photos.length > 1) {
      let i = +(ph.dataset.i || 0);
      const rect = ph.getBoundingClientRect();
      i = (e.clientX - rect.left > rect.width / 2)
        ? (i + 1) % post.photos.length
        : (i - 1 + post.photos.length) % post.photos.length;
      ph.dataset.i = i;
      ph.querySelector("img").src = post.photos[i];
      const c = ph.querySelector(".photo-counter");
      if (c) c.textContent = `${i + 1}/${post.photos.length}`;
      const dotsEl = art.querySelector(".photo-dots");
      if (dotsEl) [...dotsEl.children].forEach((d, j) => d.classList.toggle("on", j === i));
    }
    return;
  }
  const t = e.target.closest(".details-toggle");
  if (t) {
    t.classList.toggle("open");
    t.nextElementSibling.classList.toggle("open");
    const lbl = t.querySelector(".dt-label");
    if (lbl) lbl.textContent = t.classList.contains("open") ? "Hide details" : "Tap for details";
    return;
  }
  const more = e.target.closest(".more-link");
  if (more) {
    more.closest(".caption").classList.add("expanded");
    return;
  }
  const like = e.target.closest(".like-btn");
  if (like) {
    like.classList.toggle("liked");
    const n = like.querySelector("span");
    n.textContent = parseInt(n.textContent) + (like.classList.contains("liked") ? 1 : -1);
  }
});

render();
